# 安伴 · Nginx 同域反代
# 用法见 deploy/DEPLOY.md：替换域名/路径后放到 /etc/nginx/sites-available/anban

server {
    listen 80;
    listen [::]:80;
    server_name anban.example.com;

    # certbot 会自动把 80 改成跳转；首次申请证书前保持可访问
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anban.example.com;

    ssl_certificate     /etc/letsencrypt/live/anban.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anban.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/anban/app;
    index index.html;
    client_max_body_size 16m;

    # 静态页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理 API：同域，前端无需改 endpoint
    location ~ ^/(judge|act|expand|asr|log|health)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /cache/clear {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
