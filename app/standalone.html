    slots: KB.slots || [],
    entries: KB.entries || {},
    data_date: KB.data_date || '',
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · 消息流（聊天式界面）
   2026-11-19 新增。依据用户裁决：演示界面做成聊天式，可回看对话记录。

   为什么用消息流替代「日常/紧急两个视图」：
     双视图是「切换后旧内容消失」。聊天式要求「旧内容留在上面」，
     而两者无法共存 —— 双视图靠 hidden 隐藏，隐藏的内容用户看不到，
     也就无法回看。因此合并为单一流，模式改为「消息上的标记」。

   ★ 核心设计：当前回答容器的 id 是**动态**的
     每条新回答都会创建一个新容器，并接过 `dailyAnswer` / `emgAnswer` 这个 id；
     旧容器的 id 被摘掉，但 DOM 完整保留。
     这样做的三个理由：
       1. 623 条既有断言按 `getElementById('dailyAnswer')` 取「最新回答」，
          语义不变，测试无需重写（这是改动可控的关键）。
       2. 旧消息的 DOM 不被搬动 → 打勾、朗读按钮、分诊选项**仍然可交互**
          （若改成「快照静态 HTML」，旧消息就变成死的，违背「可回看」）。
       3. 保留「同一时刻只有一个 #dailyAnswer」的 DOM 合法性
          （id 必须唯一，不能多条消息共用同一个 id）。

   数据结构（一档，已声明）：
     message = { id, role, kind, mode, at, el }
       - role: 'user' | 'assistant'
       - kind: 'text' | 'steps' | 'daily' | 'dialonly' | 'refuse' | 'triage' | 'notice'
       - mode: 该条消息所属模式，S8 靠它判断而不是靠隐藏视图
       - el:   气泡节点（不存文本 —— 内容唯一真相在 DOM，避免双份状态不同步）
   ========================================================= */
(function (global) {
  'use strict';

  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('app');
    if (t[level]) t[level](msg, fields);
  }

  var seq = 0;
  var messages = [];
  var flow = null;
  var scroller = null;

  function ensure() {
    if (flow) return flow;
    flow = document.getElementById('msgFlow');
    scroller = document.getElementById('msgScroll') || flow;
    return flow;
  }

  /* ---------- 滚动定位（2026-11-21 第三次修订，用户裁决） ----------
     演进过程（每次都是真机反馈驱动的，别把结论倒回去）：
       ① 初版：滚到固定答案容器顶部 → 聊天式改造后不再适用
       ② 11-21 上午：滚到消息流**最底部** → 用户报「不会滑动到对话记录」
          真因是只设了 `#msgScroll.scrollTop`，而 `#main` 是 min-height:100vh，
          内容撑高后 msgScroll 不可滚，真正在滚的是 document（实测数据见下）
       ③ 11-21 晚：用户报「输入后要跳转到用户说的话下面，不要直接跳到底部」
          滚到底会让刚出的答案被推到视口之上，老人只看到答案末尾。

     所以现在定位到**本轮用户气泡的顶部**：用户先看到自己说了什么，
     答案紧接其下，顺着往下读。这符合「一句话 + 一个回答」的阅读顺序。

     ⚠️ 关键实现约束（踩过才知道）：
       · `#main` 是 min-height:100vh，msgScroll 高度恒等于内容高度 → 不可滚；
         真正滚动的是 document。所以必须**运行时判断谁真的能滚**，
         不能写死容器（布局若改成 height:100dvh 则反过来）。
         实测：msgScroll 7313==7313（不可滚）/ document 7753>546（在滚）。
       · `.disclaimer` 与 `.mode-band` 是 position:sticky，会盖住滚动目标。
         直接滚到气泡顶部会让气泡被顶部条遮住，所以扣掉 sticky 高度。
       · 用瞬时滚动不用 smooth：手机上键盘收起动画会与 smooth 抢帧，落点不定。
       · 短答案时目标位置会超过可滚范围，浏览器自动 clamp 到最大值，
         不会留空白 —— 这是我们要的，不需要额外处理。 */

  /* 顶部 sticky 元素的实际遮挡高度。两者都是 sticky，滚动后贴在视口顶部。 */
  function stickyTopHeight() {
    var h = 0;
    try {
      var d = document.querySelector('.disclaimer');
      if (d && d.getBoundingClientRect) h += d.getBoundingClientRect().height || 0;
      var band = document.getElementById('modeBand');
      if (band && !band.hidden && band.getBoundingClientRect) {
        h += band.getBoundingClientRect().height || 0;
      }
    } catch (e) {
      /* 取不到就不扣，最多被遮一点点，不影响可用性 */
    }
    return h;
  }

  /* 谁真的溢出，就滚谁。+4 是给亚像素高度留的容差。 */
  function pickScroller() {
    if (scroller && scroller.scrollHeight > scroller.clientHeight + 4) return scroller;
    var doc = document.scrollingElement || document.documentElement;
    if (doc && doc.scrollHeight > doc.clientHeight + 4) return doc;
    return null;
  }

  /* 把某个节点滚到视口顶部（留出 sticky 遮挡与一点呼吸间距）。 */
  function scrollToNode(node, smooth, gap) {
    if (!ensure() || !node || !node.getBoundingClientRect) return false;
    try {
      var target = pickScroller();
      if (!target) return false;
      var nodeRect = node.getBoundingClientRect();
      /* document 滚动时基准是视口顶端；容器滚动时要减掉容器自身的位置 */
      var baseTop = 0;
      if (target !== document.scrollingElement && target !== document.documentElement) {
        baseTop = target.getBoundingClientRect().top || 0;
      }
      var top = nodeRect.top - baseTop + target.scrollTop - stickyTopHeight() - (gap || 8);
      if (top < 0) top = 0;
      if (smooth && target.scrollTo) {
        target.scrollTo({ top: top, behavior: 'smooth' });
      } else {
        target.scrollTop = top; // 超出范围时浏览器自动 clamp
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  /* 滚到最近一条**用户消息**的顶部。找不到用户消息时返回 false，由调用方兜底。 */
  function scrollToLatestUser(smooth) {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user' && messages[i].el) {
        return scrollToNode(messages[i].el, smooth, 8);
      }
    }
    return false;
  }

  /* 滚到底部。保留给「找不到用户消息」等兜底场景，正常路径不再用它。

     ⚠️ 2026-11-21 修的真 bug（真机症状「不会滑动到对话记录」）：
     原来只写 `scroller.scrollTop = scroller.scrollHeight`。但 `#main` 用的是
     `min-height: 100vh` 而不是 `height`，内容一多，flex 容器被内容撑高，
     `#msgScroll` 的高度恒等于内容高度 —— **它根本不可滚**。
     实测（400×700 视口，12 条长消息后）：
         msgScroll  scrollHeight 7313 == clientHeight 7313  → 不能滚
         document   scrollHeight 7753 >  clientHeight 546   → 真在滚的是它
     所以设置 msgScroll.scrollTop 等于往墙上贴纸，页面纹丝不动。 */
  function scrollToEnd(smooth) {
    if (!ensure()) return;
    try {
      var target = pickScroller();
      if (!target) return;
      var top = target.scrollHeight;
      if (smooth && target.scrollTo) {
        target.scrollTo({ top: top, behavior: 'smooth' });
      } else {
        target.scrollTop = top;
      }
    } catch (e) {
      /* 沙箱/旧浏览器没有 scrollTop 也无所谓，滚动失败不影响内容可见 */
    }
  }

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }

  /* 追加一条用户消息（用户说过的话，原样显示，不改写） */
  function appendUser(text) {
    if (!ensure()) return null;
    var bubble = el('article', 'msg msg-user');
    var p = el('p', 'msg-text');
    p.textContent = String(text == null ? '' : text);
    bubble.appendChild(p);
    flow.appendChild(bubble);
    var m = {
      id: 'm' + ++seq,
      role: 'user',
      kind: 'text',
      mode: (global.APP_STATE && global.APP_STATE.mode) || 'daily',
      at: Date.now(),
      el: bubble,
    };
    messages.push(m);
    lg('debug', '消息追加（用户）', { id: m.id, mode: m.mode });
    return m;
  }

  /* 创建一条助手消息，并返回**其中的答案容器**。
     kind 只用于样式与统计，渲染仍由 render.js 完成（保持职责单一）。
     同一时刻只有一个容器持有 dailyAnswer/emgAnswer 这两个 id：
     先把旧容器的 id 摘掉，再给新容器。 */
  function answerHost(kind, mode) {
    if (!ensure()) return null;
    var id = mode === 'emergency' ? 'emgAnswer' : 'dailyAnswer';

    var bubble = el('article', 'msg msg-assistant');
    if (mode === 'emergency') bubble.className += ' is-emergency';
    if (kind) bubble.setAttribute('data-kind', kind);

    var host = el('div', 'answer-area');
    host.setAttribute('aria-live', mode === 'emergency' ? 'assertive' : 'polite');
    bubble.appendChild(host);
    flow.appendChild(bubble);

    /* 摘掉旧容器的 id（不是删除节点）。旧消息照常显示、照常可交互，
       只是不再是「最新的那条」。 */
    var prev = document.getElementById(id);
    if (prev && prev !== host && prev.removeAttribute) prev.removeAttribute('id');
    /* 新容器接管 id。注意顺序：必须先摘旧、再设新，
       否则 getElementById 会先拿到旧的那个，导致后面连摘带设互相打架。 */
    host.setAttribute('id', id);

    var m = {
      id: 'm' + ++seq,
      role: 'assistant',
      kind: kind || 'text',
      mode: mode || 'daily',
      at: Date.now(),
      el: bubble, // 气泡节点
      /* host = 答案容器。为什么单独记一份：
         ① 测试要读「这条消息的回答内容」，而气泡的 innerHTML 在真实 DOM 里
            包含容器包装，在沙箱 stub 里则不会随子节点更新 —— 有 host 就不用猜层级。
         ② 后续工具化时调度器要知道「往哪条消息追加」，靠 el 找子节点太脆。 */
      host: host,
    };
    messages.push(m);
    lg('debug', '消息追加（助手）', { id: m.id, kind: m.kind, mode: m.mode });
    return host;
  }

  /* 一条轻量提示消息（例如「当前离线」「语音不可用」）。
     独立成条，不塞进答案容器 —— 塞进去会被下一次渲染覆盖掉。 */
  function appendNotice(text, isWarn) {
    if (!ensure()) return null;
    var bubble = el('article', 'msg msg-notice' + (isWarn ? ' is-warn' : ''));
    var p = el('p', 'msg-text');
    p.textContent = String(text == null ? '' : text);
    bubble.appendChild(p);
    flow.appendChild(bubble);
    messages.push({
      id: 'm' + ++seq,
      role: 'assistant',
      kind: 'notice',
      mode: (global.APP_STATE && global.APP_STATE.mode) || 'daily',
      at: Date.now(),
      el: bubble,
    });
    return bubble;
  }

  /* 模式切换：旧助手消息保留，但置灰且不可交互（D-11 = A，2026-11-20）。
     为什么只锁助手消息：用户气泡没有可点元素，锁它没有意义。
     为什么在 enterEmergency() 里、answerHost() 之前调用：
       新结果消息还没创建，所以不会被误锁；之后创建的紧急消息保持可交互。
     为什么用 class + pointer-events 而不是删 DOM：
       保留「可回看」；置灰只是表示「这条属于上一个模式」，不是删除。 */
  function lockOldMessages() {
    var count = 0;
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (!m || m.role !== 'assistant' || !m.el) continue;
      if (m.el.classList && m.el.classList.contains('is-old-locked')) continue;
      if (m.el.classList) m.el.classList.add('is-old-locked');
      if (m.el.setAttribute) m.el.setAttribute('aria-disabled', 'true');
      /* 键盘/读屏也要不可达；CSS 的 pointer-events 只管鼠标/触摸。 */
      var nodes = m.el.querySelectorAll ? m.el.querySelectorAll('button, a, [role="button"]') : [];
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].setAttribute) {
          nodes[j].setAttribute('tabindex', '-1');
          nodes[j].setAttribute('aria-disabled', 'true');
        }
      }
      count++;
    }
    lg('info', '旧结果已锁定（保留但置灰不可交互）', { count: count });
    /* 默认日志级别是 warn；这是用户可见的交互变化，必须留痕。 */
    if (LOG && LOG.always) LOG.always('app', '旧结果已锁定（置灰不可交互）', { count: count });
    return count;
  }

  /* 退出紧急（S8 显式退出，2026-11-20）：把旧消息恢复可交互。
     只在用户通过 ack 卡二次确认「已经安全」后调用；日常问题不会触发。 */
  function unlockOldMessages() {
    var count = 0;
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (!m || m.role !== 'assistant' || !m.el) continue;
      if (!m.el.classList || !m.el.classList.contains('is-old-locked')) continue;
      m.el.classList.remove('is-old-locked');
      if (m.el.removeAttribute) m.el.removeAttribute('aria-disabled');
      var nodes = m.el.querySelectorAll ? m.el.querySelectorAll('button, a, [role="button"]') : [];
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].removeAttribute) {
          nodes[j].removeAttribute('tabindex');
          nodes[j].removeAttribute('aria-disabled');
        }
      }
      count++;
    }
    lg('info', '旧结果已解锁（回到日常）', { count: count });
    if (LOG && LOG.always) LOG.always('app', '旧结果已解锁（回到日常）', { count: count });
    return count;
  }

  /* 清空消息流（目前只在测试与「重新开始」时用） */
  function clear() {
    if (!ensure()) return;
    flow.innerHTML = '';
    messages.length = 0;
    seq = 0;
  }

  function stats() {
    var byMode = { daily: 0, emergency: 0 };
    for (var i = 0; i < messages.length; i++) byMode[messages[i].mode]++;
    return { total: messages.length, daily: byMode.daily, emergency: byMode.emergency };
  }

  if (!document.getElementById) {
    // 极端环境（无 DOM）下静默禁用，不影响其它模块加载
    lg('warn', '消息流不可用：无 document.getElementById');
  }

  global.CHAT = {
    appendUser: appendUser,
    answerHost: answerHost,
    appendNotice: appendNotice,
    lockOldMessages: lockOldMessages,
    unlockOldMessages: unlockOldMessages,
    scrollToEnd: scrollToEnd,
    scrollToLatestUser: scrollToLatestUser,
    scrollToNode: scrollToNode,
    clear: clear,
    messages: messages,
    stats: stats,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<!-- 工具表必须在 agent.js 之前：调度器运行时取 window.TOOLS -->
<script>
/* =========================================================
   应急助手 · 工具注册表（8 个工具 + 前置条件门 + 白名单）
   依据 docs/03 §2.5。用户 2026-11-19 裁决：8 个工具全部上，统一由循环调度。

   ★ 本文件的三条硬约束（写在这里防止被简化掉）
     1. 拨号工具**只生成按钮，永不代为拨出**（01 §6 段末、§4.6）
     2. 出内容的工具必须有 lookup_scene 前置条件；dial / refuse 作为安全出口不设门槛
     3. speak 只吃「条目字段」，不吃自由文本（否则违反 S1/S7）

   为什么「前置条件」比 prompt 有效：
     history 由**代码**写入，不由模型自报。模型无法声明「我查过了」，
     只能实际调用一次 lookup_scene，代码才会写入记录。这是伪造不了的。

   工具的两种类别（决定是否花 LLM 往返）：
     探查类（NEED_MODEL）：lookup_scene / ask —— 由模型决定调哪个
     动作类（本地执行）：其余 6 个 —— 由代码按下表的规则执行
   紧急链路因此可以零 LLM 往返：detectDanger 命中 → 直接 get_steps/triage/dial。
   ========================================================= */
(function (global) {
  'use strict';

  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('app');
    if (t[level]) t[level](msg, fields);
  }

  /* ---------- 号码白名单 ----------
     为什么必须白名单而不是「看起来像号码就行」：
     模型若给出 110/114/1199 这类号码，用户拨出去会浪费救援资源或打不通。
     白名单来源只有三处：条目自带的 emergency_number、DANGER_RULES 的 number、兜底 120。 */
  var FALLBACK_NUMBER = '120';

  function allowedNumbers(entries) {
    var set = { 120: true, 119: true };
    for (var id in entries || {}) {
      if (entries[id] && entries[id].emergency_number) set[entries[id].emergency_number] = true;
    }
    var R = global.RETRIEVAL;
    if (R && R.DANGER_RULES) {
      for (var i = 0; i < R.DANGER_RULES.length; i++) {
        if (R.DANGER_RULES[i].number) set[R.DANGER_RULES[i].number] = true;
      }
    }
    return set;
  }

  /* ---------- 8 个工具的声明 ----------
     needsModel = true 的才是「探查类」，其余为本地动作。
     结束循环的工具：get_steps / get_daily / dial / refuse（产出终态卡）
     triage 不结束：它等用户点选；ask 也不结束：它等用户回答。 */
  var REGISTRY = [
    {
      name: 'lookup_scene',
      needsModel: true,
      endsLoop: false,
      desc: '查这个场景有没有已发布条目',
      args: ['scene'],
    },
    {
      name: 'ask',
      needsModel: true,
      endsLoop: false,
      desc: '二选一追问，等用户点选',
      args: ['scene', 'options'],
    },
    {
      name: 'get_steps',
      needsModel: false,
      endsLoop: true,
      desc: '出三段式步骤卡',
      args: ['scene'],
      requires: 'lookup_scene',
    },
    {
      name: 'get_daily',
      needsModel: false,
      endsLoop: true,
      desc: '出日常解释卡',
      args: ['scene'],
      requires: 'lookup_scene',
    },
    {
      name: 'triage',
      needsModel: false,
      endsLoop: false,
      desc: '出分诊卡（条目含 triage 才可调）',
      args: ['scene'],
      requires: 'lookup_scene',
    },
    {
      name: 'speak',
      needsModel: false,
      endsLoop: false,
      desc: '朗读某条目的指定段落（只吃字段，不吃自由文本）',
      args: ['entry_id', 'segment'],
    },
    {
      name: 'dial',
      needsModel: false,
      endsLoop: true,
      desc: '出拨号按钮卡（不代为拨出）',
      /* requested 是可选标志，不进 args 必填列表：
         进了列表会让所有普通 dial 都因缺参被门拒绝。 */
      args: ['number'],
    },
    {
      name: 'ack',
      needsModel: false,
      endsLoop: true,
      desc: '危险已解除（已脱困/火灭了/人没事了）时确认；只给观察提示，不出步骤',
      args: [],
    },
    {
      name: 'refuse',
      needsModel: false,
      endsLoop: true,
      desc: '出拒答卡（固定话术、零步骤）',
      args: ['reason'],
    },
  ];

  function byName(name) {
    for (var i = 0; i < REGISTRY.length; i++) {
      if (REGISTRY[i].name === name) return REGISTRY[i];
    }
    return null;
  }

  var KNOWN_NAMES = REGISTRY.map(function (t) {
    return t.name;
  });

  /* ---------- history 查询 ----------
     history 的元素形如 { act, args, result }，由调度器在**执行后**追加。
     下方所有前置条件都只读 history，不读模型的话。 */
  function findLookupOK(history, scene) {
    for (var i = 0; i < history.length; i++) {
      var h = history[i];
      if (h.act === 'lookup_scene' && h.args && h.args.scene === scene) {
        if (h.result && h.result.found && h.result.published) return true;
      }
    }
    return false;
  }

  /* ---------- 前置条件门 ----------
     返回 { ok: true } 或 { ok: false, reason }。
     ★ 安全出口（dial / refuse）不设门槛 —— 加了门槛反而会逼模型乱猜，
       且 docs/01 §3.3 的定位就是「无条件出口」。 */
  function checkGate(act, args, ctx) {
    var def = byName(act);
    if (!def) return { ok: false, reason: 'unknown-tool' };

    // 参数完整性：所有声明过的参数都必须给
    for (var i = 0; i < def.args.length; i++) {
      if (args == null || args[def.args[i]] === undefined || args[def.args[i]] === null) {
        return { ok: false, reason: 'missing-arg:' + def.args[i] };
      }
    }

    /* 场景白名单：越界直接非法，不进循环。

       ⚠️ 2026-11-19 修（e2e「有人落水了」被判 refuse）：
       第一版对**所有**工具都强制 scene ∈ 白名单，但白名单来自前端产物，
       而产物只含**已发布**槽位（9 个）—— 于是 drowning（slot 未发布）被拒。
       后果：模型正确地走「查一下→发现没条目→给拨号卡」，却被门拦住，
       用户拿到的是拒答卡（比拨号卡更差：没有号码可打）。

       正确区分：
         · lookup_scene 是**只读探查**，参数越界无害 —— 查不存在的场景
           自然返回 found=false，不产出任何内容。所以它**允许任意字符串**。
         · 其余工具（get_steps / get_daily / triage / speak）会产出内容，
           必须严格在白名单内 —— 这才是「防模型自造场景」该管的地方。 */
    if (args && args.scene !== undefined && args.scene !== null && act !== 'lookup_scene') {
      if (!ctx.sceneIds || ctx.sceneIds.indexOf(args.scene) < 0) {
        return { ok: false, reason: 'scene-not-in-registry' };
      }
    }

    // 前置条件：出内容的工具必须先成功 lookup 过同一个 scene
    if (def.requires === 'lookup_scene') {
      if (!findLookupOK(ctx.history, args.scene)) {
        return { ok: false, reason: 'no-lookup' };
      }
      // 还要再确认一次条目在库（entries 由调用方注入）
      var entry = ctx.entries && ctx.entries[args.scene];
      if (!entry) return { ok: false, reason: 'entry-missing' };
    }

    // triage 只能对含分诊的条目调用
    if (act === 'triage') {
      var e2 = ctx.entries && ctx.entries[args.scene];
      if (!e2 || !e2.triage || !e2.triage.options || !e2.triage.options.length) {
        return { ok: false, reason: 'no-triage' };
      }
    }

    /* ask：必须**恰好两个**可用选项。
       ⚠️ 2026-11-19 补（此前只有 renderAsk 里的 `options.slice(0, 2)`）：
       那个写法在模型给 3 个时静默丢一个、给 1 个时变成单选按钮，
       而用户看到的是一张「看起来正常」的追问卡 —— 与 docs/03 §5.4
       「不许静默降级」是同一类错误。放行前查清，不合法就拒，
       让模型看到 ask-needs-two-options 重给，而不是让用户替它承担。

       为什么必须是 2：`01` §2.4 已裁决老人产品不做连续追问，
       二选一是「一次点击能答完」的形式上限。 */
    if (act === 'ask') {
      var asks = args.options;
      if (!asks || typeof asks.length !== 'number' || asks.length !== 2) {
        return { ok: false, reason: 'ask-needs-two-options' };
      }
      for (var k = 0; k < 2; k++) {
        var one = asks[k];
        var lab = typeof one === 'string' ? one : one && one.label;
        if (typeof lab !== 'string' || !lab.replace(/\s/g, '')) {
          return { ok: false, reason: 'ask-empty-option' };
        }
      }
    }

    // dial：号码必须在白名单内
    if (act === 'dial') {
      var allowed = allowedNumbers(ctx.entries);
      if (!allowed[String(args.number)]) {
        return { ok: false, reason: 'number-not-allowed', fallback: FALLBACK_NUMBER };
      }
    }

    // speak：只吃条目字段，不吃自由文本
    if (act === 'speak') {
      var e3 = ctx.entries && ctx.entries[args.entry_id];
      if (!e3) return { ok: false, reason: 'entry-missing' };
      if (['immediate', 'next', 'never', 'daily', 'triage'].indexOf(args.segment) < 0) {
        return { ok: false, reason: 'segment-not-allowed' };
      }
    }

    return { ok: true, def: def };
  }

  /* ---------- 执行 ----------
     返回 { ok, result, kind, ends }。
     ★ 这里只算「事实」，不碰 DOM —— 渲染由调用方用 RENDER 完成。
       分开的理由：工具表要能被离线断言（selftest 直接调 execute 即可），
       不需要造 DOM。 */
  function execute(act, args, ctx) {
    var gate = checkGate(act, args, ctx);
    if (!gate.ok) {
      lg('warn', '工具调用被前置条件拒绝', { act: act, reason: gate.reason });
      return { ok: false, reason: gate.reason, fallbackNumber: gate.fallback || null, ends: false };
    }

    var entries = ctx.entries || {};
    var entry;

    if (act === 'lookup_scene') {
      entry = entries[args.scene];
      var res = {
        found: !!entry,
        published: !!(entry && entry.status === 'published'),
        entry_id: entry ? entry.id : null,
      };
      // published 兜底：构建产物里只会有 published 条目，但自测会传任意条目
      if (entry && entry.status === undefined) res.published = true;
      return { ok: true, result: res, ends: false };
    }

    if (act === 'get_steps') {
      entry = entries[args.scene];
      return { ok: true, result: { entryId: entry.id }, kind: 'steps', entry: entry, ends: true };
    }

    if (act === 'get_daily') {
      entry = entries[args.scene];
      return { ok: true, result: { entryId: entry.id }, kind: 'daily', entry: entry, ends: true };
    }

    if (act === 'triage') {
      entry = entries[args.scene];
      return { ok: true, result: { entryId: entry.id }, kind: 'triage', entry: entry, ends: false };
    }

    if (act === 'speak') {
      return {
        ok: true,
        result: { entryId: args.entry_id, segment: args.segment },
        kind: 'speak',
        ends: false,
      };
    }

    if (act === 'dial') {
      return {
        ok: true,
        result: { number: String(args.number), requested: !!args.requested },
        kind: 'dial',
        entry: null,
        number: String(args.number),
        /* 用户明确要求拨号：只出卡，不锁紧急（由前端按此字段区分）。
           安全出口拨号不带这个字段，仍走紧急锁定。 */
        requested: !!args.requested,
        ends: true,
      };
    }

    if (act === 'ack') {
      /* 状态更新/已脱困：终态，但没有内容字段可给。
         它只表示「危险解除」，绝不产出步骤 —— 归入安全出口一类。 */
      return { ok: true, result: {}, kind: 'ack', ends: true };
    }

    if (act === 'refuse') {
      return {
        ok: true,
        result: { reason: args.reason || 'unspecified' },
        kind: 'refuse',
        ends: true,
      };
    }

    if (act === 'ask') {
      return {
        ok: true,
        result: { scene: args.scene, options: args.options },
        kind: 'ask',
        ends: false,
      };
    }

    return { ok: false, reason: 'unhandled-tool', ends: false };
  }

  global.TOOLS = {
    REGISTRY: REGISTRY,
    KNOWN_NAMES: KNOWN_NAMES,
    byName: byName,
    checkGate: checkGate,
    execute: execute,
    allowedNumbers: allowedNumbers,
    findLookupOK: findLookupOK,
    FALLBACK_NUMBER: FALLBACK_NUMBER,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · 渲染层（纯渲染 + 事件绑定）
   从 app.js 拆出：原本 505–688 行，与状态、路由、语音混在一起。

   本层遵守一条硬规则（S1 / S7）：
     **所有可见文字只来自条目字段**（steps / never / daily / triage / name），
     本文件不做任何拼写改写，也不生成任何库外句子。
     唯一固定的自然语言是 REFUSE_TEXT，它是 S4 规定的拒答话术，不含操作动作。

   拆分带来的唯一行为变化（已在交付说明中列明）：
     渲染函数仍然会触发朗读（autoRead*），因为「出卡就念」是 M2 已验收的行为。
     后续工具化（docs/03 §2.5）会把朗读改为由调度器调用 speak 工具，
     届时删掉这里的三处 autoRead 调用即可，不需要改任何渲染结构。
   ========================================================= */
(function (global) {
  'use strict';

  var LOG = global.LOG || null;

  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('app');
    if (t[level]) t[level](msg, fields);
  }

  /* ⚠️ 朗读层必须**运行时取**，不能在加载期缓存到局部变量。
     踩过的坑（2026-11-19 拆分当天）：render.js 在 speak.js 之前加载，
     加载期写成 `var SPEAK = global.SPEAK` 会永久拿到 null，
     表现是「渲染正常、朗读全部静默」——13 条断言变红才发现。
     这正是 docs/10 §6 第 2 条「不能依赖 script 顺序」的实例。 */
  function speakLayer() {
    return global.SPEAK || null;
  }

  /* 朗读调用统一走这里：SPEAK 缺失时退化为静默 no-op。
     docs/10 §6 第 1 条「横切模块必须可摘除」——没加载 speak 时产品仍可用。 */
  function speak(what, entry, extra) {
    var S = speakLayer();
    if (!S || !S[what]) {
      lg('debug', '朗读层缺失，跳过', { what: what, entryId: entry && entry.id });
      return;
    }
    if (what === 'autoReadCard') S.autoReadCard(entry, extra);
    else if (what === 'autoReadCall') S.autoReadCall(extra);
    else if (what === 'autoReadText') S.autoReadText(extra);
    /* autoReadDaily 也要透传 extra（2026-11-22）：里面带 { readText }，
       丢掉它就会退回「读条目 summary」，屏幕与声音又不一致。
       这一行漏掉时不会报错，只会静默读错内容 —— 属于最难查的那类。 */
    else if (what === 'autoReadDaily') S.autoReadDaily(entry, extra);
    else S[what](entry);
  }

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ---------- 三段式步骤卡 ----------
     契约 §4.5：tool 全部忽略，只渲染 text。
     拨号按钮由 emergency_number 驱动，依据是 S5（生命危险场景须有显式拨号按钮），
     不是已删除的 S9。与步骤级 tool 无关。

     note（2026-11-20 新增，用户裁决「按危险定优先级，但要同时给出解释」）：
       一句来自模型的解释，说明「为什么先处理这件事」。
       为什么放在标题正下方而不是卡片底部：紧急时用户从上往下扫，
       放底部等于没有。也不能只靠颜色/图标表达优先级 —— 老人看不懂图标语言。
     ⚠️ note 是**解释**不是动作：S7 规定回答里的操作动作必须全部来自 steps/never，
       所以这里只渲染文字，绝不把它当步骤，也不朗读（见 speakSteps）。 */
  function renderSteps(entry, immediateSteps, container, note) {
    var segMap = [
      { key: 'immediate', title: '立刻做', cls: 'seg-immediate', checkable: true },
      { key: 'next', title: '接着做', cls: 'seg-next', checkable: true },
      { key: 'never', title: '绝对不要做', cls: 'seg-never', checkable: false },
    ];

    var body = segMap
      .map(function (seg) {
        var arr =
          seg.key === 'immediate' && immediateSteps ? immediateSteps : entry.steps[seg.key] || [];
        if (!arr.length) return '';
        var items = arr
          .map(function (step) {
            var text = esc(step.text);
            if (!seg.checkable) {
              return (
                '<li><div class="step" role="note">' +
                '<span class="box" aria-hidden="true">×</span>' +
                '<span class="txt">' +
                text +
                '</span></div></li>'
              );
            }
            return (
              '<li><button class="step" type="button" aria-pressed="false">' +
              '<span class="box" aria-hidden="true"></span>' +
              '<span class="txt">' +
              text +
              '</span></button></li>'
            );
          })
          .join('');
        return (
          '<section class="seg ' +
          seg.cls +
          '">' +
          '<h3 class="seg-head"><span class="bar" aria-hidden="true"></span>' +
          seg.title +
          '</h3>' +
          '<ul class="steps">' +
          items +
          '</ul></section>'
        );
      })
      .join('');

    var num = entry.emergency_number;
    container.innerHTML =
      '<article class="card">' +
      '<h2 class="card-title">' +
      esc(entry.name) +
      '</h2>' +
      (note ? '<p class="card-note">' + esc(note) + '</p>' : '') +
      body +
      '<div class="voice-row">' +
      '<button class="voice-btn" type="button" data-act="read" aria-label="朗读这张卡片">' +
      '<span class="voice-ico" aria-hidden="true">▸</span>朗读一遍' +
      '</button>' +
      '<button class="voice-btn is-stop" type="button" data-act="stop" aria-label="停止朗读">停止</button>' +
      '</div>' +
      '<div class="dial-row"><a class="dial-btn" href="tel:' +
      esc(num) +
      '">拨打 ' +
      esc(num) +
      '</a></div>' +
      '</article>';

    // 朗读：文本由 voice.js 从条目字段拼接，**不改写一个字**（S1）
    var readBtn = container.querySelector('[data-act="read"]');
    if (readBtn) {
      readBtn.addEventListener('click', function () {
        var S1 = speakLayer();
        if (S1) S1.speakSteps(entry, immediateSteps);
      });
    }
    var stopBtn = container.querySelector('[data-act="stop"]');
    if (stopBtn) {
      /* 按停止不只是这次停下，还要**本会话内不再自动读**。
         理由：自动朗读如果按了停还继续读，等于用户说「别念了」而系统不听。 */
      stopBtn.addEventListener('click', function () {
        var S4 = speakLayer();
        if (S4) S4.muteAutoRead();
      });
    }

    // 打勾：点一下切换，再点取消。按容器隔离 → 聊天流里多张卡片互不串状态
    container.querySelectorAll('.step[aria-pressed]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var on = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', on ? 'false' : 'true');
        var box = btn.querySelector('.box');
        if (box) box.textContent = on ? '' : '✓';
      });
    });
  }

  /* ---------- 分诊：先问 1 个分支，再给步骤（契约 §5） ---------- */
  function renderStepsCard(entry, container, note) {
    if (!entry.triage || !entry.triage.options || !entry.triage.options.length) {
      renderSteps(entry, null, container, note);
      speak('autoReadCard', entry, null);
      return;
    }
    var opts = entry.triage.options
      .map(function (o, i) {
        return (
          '<button class="triage-btn" type="button" data-i="' +
          i +
          '">' +
          esc(o.label) +
          '</button>'
        );
      })
      .join('');
    /* 分诊卡也要有朗读/停止（2026-11-19 修复 K2）。
       为什么必须补：gas_leak / earthquake / fall_elderly 三条走分诊，
       而**分诊卡就是它们的首屏**。没有这两个按钮，老人在首屏自动读完之后
       没听清就无法重播，响了也无法按停 —— M2 必做项 2「可重播、可打断」
       在这三条场景上不成立。 */
    container.innerHTML =
      '<article class="card">' +
      '<h2 class="card-title">' +
      esc(entry.name) +
      '</h2>' +
      (note ? '<p class="card-note">' + esc(note) + '</p>' : '') +
      '<p class="triage-q">' +
      esc(entry.triage.question) +
      '</p>' +
      '<div class="triage-opts">' +
      opts +
      '</div>' +
      '<div class="voice-row">' +
      '<button class="voice-btn" type="button" data-act="read" aria-label="再听一遍这个问题">' +
      '<span class="voice-ico" aria-hidden="true">▸</span>再听一遍' +
      '</button>' +
      '<button class="voice-btn is-stop" type="button" data-act="stop" aria-label="停止朗读">停止</button>' +
      '</div>' +
      '</article>';

    // 手动重播：与步骤卡同一套逻辑（读问题+选项+安全句），不受静默限制
    var readBtn = container.querySelector('[data-act="read"]');
    if (readBtn) {
      readBtn.addEventListener('click', function () {
        var S2 = speakLayer();
        if (S2) S2.speakTriage(entry);
      });
    }
    var stopBtn = container.querySelector('[data-act="stop"]');
    if (stopBtn) {
      stopBtn.addEventListener('click', function () {
        var S4 = speakLayer();
        if (S4) S4.muteAutoRead();
      });
    }

    // 分诊阶段还没有步骤，只能读问题与选项
    speak('autoReadTriage', entry);
    container.querySelectorAll('.triage-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var o = entry.triage.options[Number(btn.getAttribute('data-i'))];
        var override = o && o.override && o.override.immediate ? o.override.immediate : null;
        renderSteps(entry, override, container);
        // 选完就读对应的步骤（override），不能读默认步骤
        speak('autoReadCard', entry, override);
      });
    });
  }

  /* ---------- 用户明确要求拨号 → 只给拨号卡，不写成「没有步骤」 ----------
     与 renderDialOnly 的区别：
       dialonly 是「这个场景我没内容，先打电话」；
       这里是「用户就是要打电话」，没有场景判断，也不该锁紧急。 */
  function renderCallRequest(number, container) {
    container.innerHTML =
      '<article class="dialonly call-request">' +
      '<p class="headline">现在拨打 ' +
      esc(number) +
      '</p>' +
      '<p>点了会打开拨号盘，由您按下拨出。</p>' +
      '<div class="dial-row"><a class="dial-btn" href="tel:' +
      esc(number) +
      '">拨打 ' +
      esc(number) +
      '</a></div>' +
      '</article>';
    speak('autoReadCall', null, number);
  }

  /* ---------- 紧急命中但无条目 → 只给号码，不给步骤 ---------- */
  function renderDialOnly(number, container) {
    container.innerHTML =
      '<article class="dialonly">' +
      '<p class="headline">这个情况我没有可靠的操作步骤。</p>' +
      '<p>我不编步骤。请先打电话求救，接线员会一步步教你。</p>' +
      '<div class="dial-row"><a class="dial-btn" href="tel:' +
      esc(number) +
      '">拨打 ' +
      esc(number) +
      '</a></div>' +
      '</article>';
    speak('autoReadText', null, '这个情况我没有可靠的操作步骤。请先拨打 ' + number + '。');
  }

  /* ---------- 已脱困 / 状态更新（ack） ----------
     为什么单独一张卡而不是复用 daily：
       这一步没有条目可读（用户说的是「门开了/火灭了」），daily 需要 entry。
     为什么不出步骤：
       危险已解除；继续给急救步骤只会制造恐慌。只给确认 + 观察提示 + 拨号兜底。
     为什么不写场景专属动作：
       写「开窗通风」「别坐电梯」这类话就是在编操作；本产品只允许条目字段里的动作。 */
  function renderAck(container, onExit) {
    container.innerHTML =
      '<article class="refuse ack">' +
      '<p class="headline">已经安全了</p>' +
      '<p>先休息一下，注意观察身体。如果还有不舒服或受伤，拨打 120。</p>' +
      '<div class="dial-row"><a class="dial-btn" href="tel:120">拨打 120</a></div>' +
      (onExit
        ? '<div class="ack-actions">' +
          '<button type="button" class="ack-exit">结束紧急，回到日常</button>' +
          '</div>'
        : '') +
      '</article>';
    var btn = container.querySelector ? container.querySelector('.ack-exit') : null;
    if (btn && onExit) {
      /* 2026-11-21：去掉二次确认。老人主要靠“口头确认一句”退出；
         这个按钮是单次点击兜底，不再多问一遍。 */
      btn.addEventListener('click', function () {
        onExit(container);
      });
    }
    speak('autoReadAck');
  }

  /* ---------- 同一场景的追问：不重复整卡 ----------
     场景对了，但条目里没有这个子问题的答案时，再贴一张一模一样的卡
     会让用户以为「它没回答」。这里只给一句明确说明 + 回到上一条。
     不生成任何新内容；上一张卡仍在消息流里。 */
  function renderFollowupNotice(entry, question, container, prevHost) {
    container.innerHTML =
      '<article class="refuse ack">' +
      '<p class="headline">还是「' +
      esc(entry.name) +
      '」这个条目</p>' +
      '<p>库内没有更具体的「' +
      esc(question) +
      '」答案；上面那张卡仍可回看。</p>' +
      (prevHost
        ? '<div class="ack-actions">' +
          '<button type="button" class="ack-exit-no followup-back">回到上一条</button>' +
          '</div>'
        : '') +
      '</article>';
    var btn = container.querySelector ? container.querySelector('.followup-back') : null;
    if (btn && prevHost && prevHost.scrollIntoView) {
      btn.addEventListener('click', function () {
        prevHost.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }

  /* ---------- 拒答（S1 / S4：零步骤 + 固定话术 + 拨号按钮） ---------- */
  var REFUSE_TEXT =
    '这个问题我答不了。我只会说应急和安全的常识，比如燃气泄漏、老人跌倒、电梯困人。';

  function renderRefuse(container) {
    container.innerHTML =
      '<article class="refuse">' +
      '<p>' +
      esc(REFUSE_TEXT) +
      '</p>' +
      '<div class="dial-row"><a class="dial-btn" href="tel:120">拨打 120</a></div>' +
      '</article>';
    /* 拒答卡不自动朗读：它是「没有答案」，不是用户要的日常解释；
       先把声音留给真正的内容卡，避免老人被一段固定拒答话术拦住。 */
  }

  /* ---------- 日常模式只用 daily 四字段拼装 ---------- */
  function renderDaily(entry, container, expanded, opts) {
    var d = entry.daily || {};
    /* P5：expanded 只替换「解释」那一段；下面的 prevention 列表仍逐字来自条目。
       为什么保留静态 why：它是已标注、可回溯的内容；扩写失败时整张卡不受影响。 */
    var lead = expanded && expanded.text ? expanded.text : d.summary || '';
    var prev = (d.prevention || [])
      .map(function (p) {
        return '<li>' + esc(p) + '</li>';
      })
      .join('');
    container.innerHTML =
      '<article class="card">' +
      '<h2 class="card-title">' +
      esc(entry.name) +
      '</h2>' +
      '<div class="explain">' +
      '<p class="lead">' +
      esc(lead) +
      '</p>' +
      (expanded && expanded.text
        ? '<p class="card-note p5-note">这段解释由模型按条目整理；操作步骤仍来自条目。</p>'
        : '') +
      (d.why ? '<p>' + esc(d.why) + '</p>' : '') +

    var input = document.getElementById(inputId);
    if (!btn) return;

    if (!ASR) {
      // 模块没加载：按钮不显示，而不是显示一个点了没反应的按钮
      if (btn.parentNode) btn.parentNode.hidden = true;
      else btn.hidden = true;
      return;
    }
    var cap = ASR.detect();
    if (!cap.supported) {
      /* 不支持时**仍然显示按钮**，按下给明确原因。
         隐藏按钮会让老人以为「这软件没这功能」，而真正原因（要起服务/
         没权限）必须说出来。这与语音输出的处置一致（docs/01 §6.2）。 */
      btn.classList.add('is-unavailable');
      setTalkHint(hint, cap.reason, true);
      lg('warn', '语音输入不可用', { reason: cap.reason });
    }

    function onDown(ev) {
      // 去重：同一次按下可能被 pointerdown 与 keydown 各触发一次
      var now = Date.now();
      if (now - talkCtl.downAt < 400) return;
      talkCtl.downAt = now;

      if (st().talk.busy) return;
      if (ev && ev.preventDefault) ev.preventDefault();

      if (!cap.supported) {
        setTalkHint(hint, cap.reason, true);
        return;
      }
      if (talkCtl.listening) return; // 已经在录，忽略

      /* 按住说话 = 明确的中断信号：正在念的内容立刻停。
         用 stopForAction 而不是 muteAutoRead —— 用户只是要问下一句，
         不是「以后都别念了」（2026-11-19 用户裁决）。 */
      var S = global.SPEAK;
      if (S && S.stopForAction) S.stopForAction('talk-down');

      talkCtl.btn = btn;
      talkCtl.hint = hint;
      talkCtl.input = input;
      talkCtl.active = true;
      talkCtl.listening = true;

      btn.classList.add('is-rec');
      var label = btn.querySelector('.talk-label');
      if (label) label.textContent = '松开发送';
      setTalkHint(hint, '正在听…说完松开手指', true);

      ASR.start().then(function (r) {
        if (r && r.ok) return;

           若用户已松手（active=false），这次失败是过期结果，不弹提示——
           否则会出现「明明松手了，下面还跳一条失败」。 */
        if (!talkCtl.active) return;
        talkCtl.listening = false;
        talkReset();
        setTalkHint(hint, r && r.message ? r.message : '打不开麦克风。');
        lg('warn', '录音启动失败', { reason: r && r.reason, detail: r && r.message });
      });
    }

    btn.addEventListener('pointerdown', onDown);
    btn.addEventListener('keydown', function (ev) {

     理由：手指可能滑出按钮才松开，只挂按钮会永远收不到 pointerup，
     表现为「一直录到 15 秒上限」——实测踩过。

     返回值：Promise，在整条链（识别 → 填框 → 出答案 → 朗读）走完后 resolve。
     为什么要返回：测试必须能 await 到「真的出卡了」，而不是等一个固定毫秒数。
     实测踩过——e2e_asr 原来等 120ms，LLM 缓存命中时够用，清缓存后要 800–1800ms，
     测试立刻变成假失败。等完成信号永远比等时间可靠。 */
  function onTalkUp() {
    if (!talkCtl.active) return Promise.resolve('idle');
    if (!talkCtl.listening) {
      talkReset();
      return Promise.resolve('not-listening'); // start 就没成功，无需 stop
    }
    talkCtl.listening = false;
    var btn = talkCtl.btn;
    var hint = talkCtl.hint;
    var input = talkCtl.input;
    talkCtl.active = false;
    if (btn) btn.classList.remove('is-rec');
    setTalkHint(hint, '正在识别…', true);
    setTalkBusy(btn, true);
    showTalkProgress(hint && hint.parentNode, true);

    return ASR.stop().then(function (r) {
      setTalkBusy(btn, false);
      showTalkProgress(hint && hint.parentNode, false);
      if (!r || !r.ok) {
        setTalkHint(hint, (r && r.message) || '没听清，请再说一遍。');
        lg('info', '语音输入未取得文本', { reason: r && r.reason });
        return 'no-text';
      }
      setTalkHint(hint, '');
      logAlways('语音输入', {
        text: LOG ? LOG.clipText(r.text) : r.text,
        audioMs: r.duration_ms,
        latencyMs: r.latency_ms,
        cleared: true,
        autoQuery: true,
      });
      /* 立即出答案（用户裁决：不需要再确认），并清空输入框。
         先清空再提问：清空是同步的，键盘也好、滚动也好，都在
         「没有任何焦点」的前提下发生，不会互相抢。 */
      var cleared = clearInput(input);
      if (!cleared) lg('warn', '找不到输入框，直接提问（结果不丢）');
      /* handleQuery 由 app.js 在启动时注册到 window.APP_HANDLE_QUERY。
         运行时取（不缓存）是为了：app.js 最后加载，缓存会拿到 undefined。 */
      var hq = global.APP_HANDLE_QUERY;
      if (!hq) {
        lg('warn', 'handleQuery 未注册，识别结果未出答案');
        return 'no-handler';
      }
      /* 把 handleQuery 的 Promise 传出去，调用方才能 await 到「卡出完了」。 */
      return hq(r.text).then(function () {
        return 'done';
      });
    });
  }

  /* 录音到 15 秒上限时的接管：等同用户松手。
     没有这一步，自动停止后识别结果没人接，表现为「录了半天什么也没发生」。 */
  if (ASR)
    ASR.state.onAutoStop = function () {
      onTalkUp();
    };

  global.TALK = {
    ctl: talkCtl,
    initTalk: initTalk,
    onTalkUp: onTalkUp,
    talkReset: talkReset,
    clearInput: clearInput,
    setTalkHint: setTalkHint,
    available: !!ASR,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · 自主循环调度器
   依据 docs/03 §2.5（工具注册表）与用户 2026-11-19 裁决：

     ① 先判断网络环境 → 决定走「自主循环」还是「离线模式」
     ② 8 个工具统一由本调度器执行，渲染层不再自己调朗读
     ③ 紧急在循环里但不绑定：第 0 步走本地规则，零 LLM 往返 → 保住 3 秒

   ★ 三条不可让步的边界
     1. 第 0 步永远是 detectDanger（本地，实测 emergency 40/40）。
        命中就直接出步骤卡，不问模型。这是 3 秒预算的唯一保法。
     2. 只有「探查类」工具花 LLM 往返（lookup_scene / ask）。
        动作类 6 个全部本地执行 —— 所以紧急链路 LLM 往返为 0。
     3. 任何异常 → 降级到 planRule()（纯规则计划），不允许「循环挂了就没答案」。

   为什么预算只限步数、不限时间：
     时间预算会随网络抖动误伤正常请求；步数超限是可复现的确定性事件。
     P95 步数的实测值见 docs/03 §2.5.7，硬上限取 5 是保险丝，不是决策依据。
   ========================================================= */
(function (global) {
  'use strict';

  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('app');
    if (t[level]) t[level](msg, fields);
  }

  /* 硬上限：只防「模型不 finish」的失控，不作为「该走几步」的依据。
     为什么是 5：8 个工具里最长合理路径是
     lookup → triage → (用户选) → get_steps → speak，约 4 步；留 1 步余量。 */
  var MAX_STEPS = 5;

  function tools() {
    return global.TOOLS || null;
  }

  /* ---------- ① 网络环境判断 ----------
     为什么要单独一层而不是直接看 LLM 是否可用：
       「有网但代理没起」和「没网」的处置不同 —— 前者可在 UI 提示，后者直接离线模式。
       但**两者的行为一致**：都退离线计划（docs/03 §5.4 不许静默降级）。

     注意：navigator.onLine 只说明「有没有网络接口」，不说明「能不能连通」。
     所以判据是「onLine === false → 离线；否则尝试在线，失败再降级」。
     宁可多试一次，也不要把「有网但慢」误判成离线。 */
  function netState() {

       - 浏览器里 navigator 是全局，window.navigator 同源；
       - 自测沙箱里 window 是普通对象、navigator 挂在 sandbox 上，二者不同源。
       2026-11-19 踩过：只查 global.navigator 时沙箱恒返 unknown，
       导致「离线走规则计划」这条断言假失败（产品在浏览器里其实是好的）。 */
    var nav = null;
    if (typeof navigator !== 'undefined' && navigator) nav = navigator;
    else if (global && global.navigator) nav = global.navigator;

    return nav.onLine ? 'online' : 'offline';

  /* ---------- ② 纯规则计划（离线 / 降级路径） ----------
     不调 LLM，只用本地能力。注意这条路径**能力不降级的部分**：
       紧急场景（detectDanger 命中）与点图标完全不受影响，
       只有「语义辨析」退化 —— 这与 docs/03 §5.3 记录的 L3 缺陷一致。

     ★ 为什么规则计划也要先 lookup_scene：
       前置条件门管的是「有没有查过」，不是「谁提的议」。
       如果规则计划能直接 get_steps，门就有了一个后门，
       而「门是否真的有效」正是 docs/03 §2.5.11 C1 要证明的事。
       多一步本地 lookup 的代价是 0ms，换来的是「只有一条合法路径」。 */
  function lookupThen(action, scene, why) {
    return [
      { act: 'lookup_scene', args: { scene: scene }, why: why + '-lookup' },

         「我妈摔倒了没有呼吸」会命中 fall_elderly（因为「摔倒」），

       场景 id 约定（给数据同学）：CPR = cpr，大出血 = severe_bleeding。
         条目发布后，这里会自动从「拨号」切到「查条目 → 出步骤」。 */
    /* 回合策略优先（2026-11-20「工作流 + 自主决策」）：
       hypothetical / prevention → 只允许查库 + 日常解释，禁止 steps/triage/dial。

    var policy = R && R.turnPolicy ? R.turnPolicy(text) : null;
    /* 明确否认火灾：不再走 fire_home 出内容。只认“不是着火/没见明火”这类

    if (R && R.isDeniedFire && R.isDeniedFire(text)) {
      return [{ act: 'refuse', args: { reason: 'denied-fire' }, why: 'policy-denied-fire' }];

      var hitP = R.retrieve ? R.retrieve(entries, text) : null;
      if (hitP && hitP.entryId && entries[hitP.entryId]) {
        return lookupThen('get_daily', hitP.entryId, 'policy-' + policy.type);
      }
      if (danger && entries[danger.id]) {
        return lookupThen('get_daily', danger.id, 'policy-' + policy.type);
      }
      if (policy.type === 'hypothetical' && danger) {

          {
            act: 'dial',
            args: { number: danger.number || '120' },
            why: 'policy-hypothetical-no-entry',

      return [{ act: 'refuse', args: { reason: 'policy-no-entry' }, why: 'policy-' + policy.type }];

      return [{ act: 'dial', args: { number: '120' }, why: 'unresponsive-breathing-no-entry' }];

        severeScene = 'drowning';

      if (outOfScope) {
        return [{ act: 'dial', args: { number: '120' }, why: 'cpr-out-of-scope:' + outOfScope }];

        return lookupThen('get_steps', severeScene, 'severe-entry:' + severeScene);

      if (de) return lookupThen('get_steps', danger.id, 'danger-hit');

    }

  }

     decide 是一个函数：ctx => Promise<{act, args}> | {act, args}

     为什么注入而不是内部直接调 LLM：

      .then(function () {

      .then(function (first) {

     ★ 本函数不碰 DOM、不碰 RENDER，只算「该调哪些工具、按什么顺序」。

         · 但「一直只查同一个」仍是空转，必须有上限，否则死循环。

         这是「真·自主循环」的入口 —— 计划不是预先写死的列表，
         而是每步都现问模型。step 拿到动作后把自己重新调一次（i 不变），
         这样前置条件、执行、history 回灌全部复用同一段代码。

          .then(function () {
            return o.decide(text, { entries: ctx.entries, history: history, step: i });
          })
          .then(function (d) {

              return finishSafe('decide-empty');
            }

            planList[i] = {
              act: d.act,
              args: d.args || {},
              why: d.why || 'model',
              turn: d.turn || null,
              evidence: d.evidence || null,
            };
            return step(i, planList);
          })
          .catch(function (e) {

         于是把手机没电当成了煤气现场，给了 gas_leak 步骤。
         契约要求 evidence 是「用户原话片段」，所以用「证据是否落在当前句」判：
           · 落在当前句 → 正常；
           · 只落在上文，且当前句不是纯追问 → 说明模型拿上文当现场，拒答；
           · 纯追问（「怎么办」「然后呢」）允许省略，仍走上文。

      if (planned.evidence && text) {
        var evN = String(planned.evidence).replace(/\s+/g, '');
        var curN = String(text).replace(/\s+/g, '');
        var grounded = !!evN && (curN.indexOf(evN) !== -1 || evN.indexOf(curN) !== -1);
        var pureFollowup =
          /^(怎么办|然后呢|现在呢|那呢|怎么弄|要紧吗|严重吗|接下来呢|还怎么办)[？?。！!]*$/.test(
            curN
          );
        if (!grounded && !pureFollowup) {
          lg('info', '证据未落在当前句，判定为上文污染，拒答', {
            evidence: evN,
            text: curN,
          });
          return runOne(
            { act: 'refuse', args: { reason: 'context-not-grounded' }, why: 'ctx-not-grounded' },
            i,
            planList
          );
        }
      }

      /* ★ 上限：同参重复调用且观察相同 → 强制收尾（docs/03 §2.5.7）。

         ⚠️ 2026-11-19 补：§2.5.7 早就写了「同参重复调用且观察相同 → 强制 finish」，
         但代码里一直**没有实现** —— 文档与代码脱节。是 probe_multi_turn 的 MT08
         撞出来的：模型想查「儿童坠床」，但白名单里只有 fall_elderly，
         于是它反复 lookup_scene(fall_elderly) 直到撞上 MAX 步。
         症状：用户多等 4 次往返（≈4 秒），最后拿到一张安全出口卡。

         为什么必须「同参 **且** 观察相同」两个条件：
           只判同参会把「先查到未发布 → 稍后条目被发布 → 再查」误杀；
           只判观察相同会把「查 A 空、查 B 空」当成绕圈（那是正常排查）。
         两者同时成立 = 这一动作没有任何新信息 → 继续就是在空转。

         为什么不是「重试」而是「收尾」：
           空转不可能靠再跑一次解决，模型缺的是信息而不是运气。 */
      if (isRepeatedAct(act, args, history)) {
        /* P32：第一次同参重复 → 复用上次结果继续，不拒答。
           语义依据：同一 scene 的库内容在一次会话内不变，重查不会得到新信息；
           模型重查的真实意图是「确认这个条目是否适用于新主体」，复用结果即可。
           仍保留一次上限：第二次同参重复 → 收尾，防死循环。 */
        if (act === 'lookup_scene' && !repeatReuseUsed) {
          repeatReuseUsed = true;
          lg('info', '同参 lookup 重复：复用上次结果继续（P32）', {
            act: act,
            args: args,
            step: i,
          });
          return runOne({ act: act, args: args, why: 'repeat-reuse' }, i, planList);
        }
        lg('warn', '同参重复调用，强制收尾（防绕圈）', { act: act, args: args, step: i });
        return finishSafe('repeat-call');
      }

      /* ★ 前置条件门：不通过就按 reason 决定补救方式。
         这不是「重试」，是「换一条合法路径」——
         例如 no-lookup 时补一次 lookup 再继续，而不是把同一动作再发一遍。 */
      var gate = T.checkGate(act, args, {
        entries: ctx.entries,
        sceneIds: ctx.sceneIds,
        history: history,
      });

      if (!gate.ok) {
        lg('info', '前置条件未通过，改走安全出口', { act: act, reason: gate.reason });
        steps.push({ act: act, args: args, ok: false, reason: gate.reason });
        /* no-lookup 是「模型跳过了查库」，不是「模型想编内容」：
           场景 id 合法且条目在库时，补一次 lookup 再执行原动作，而不是直接拒答。
           这条补救必须在这里做——P014「灭火器怎么选」模型会直接给 get_daily，
           若一律 refuse，用户拿不到本可安全给出的日常卡。 */
        if (gate.reason === 'no-lookup' && args.scene && ctx.entries[args.scene]) {
          var autoLookup = T.execute(
            'lookup_scene',
            { scene: args.scene },
            { entries: ctx.entries, sceneIds: ctx.sceneIds, history: history }
          );
          if (autoLookup.ok) {
            steps.push({
              act: 'lookup_scene',
              args: { scene: args.scene },
              ok: true,
              result: autoLookup.result || null,
              why: 'auto-lookup',
            });
            history.push({
              act: 'lookup_scene',
              args: { scene: args.scene },
              result: autoLookup.result || null,
            });
            lg('info', 'no-lookup 自动补查后重试原动作', {
              scene: args.scene,
              act: act,
            });
            return step(i, planList);
          }
        }
        /* 关键：出内容的工具被拒 → 不许硬给内容，改拨号/拒答。
           这与 llm.js 的 low-confidence 分支同一立场（S1 不让编）。 */
        if (gate.reason === 'number-not-allowed') {
          /* 用户明确要求拨 110/114 等非白名单号码：不能悄悄改成 120。
             直接拒答并说明只提供 120/119，避免拨错号。 */
          if (args.requested) {
            return runOne(
              { act: 'refuse', args: { reason: 'number-not-allowed-request' }, why: 'gate-refuse' },
              i,
              planList
            );
          }
          return runOne(
            { act: 'dial', args: { number: T.FALLBACK_NUMBER }, why: 'number-fallback' },
            i,
            planList
          );
        }
        return runOne(
          { act: 'refuse', args: { reason: gate.reason }, why: 'gate-refuse' },
          i,
          planList
        );
      }

      /* 否定闸：用户明确说“不是着火/没见明火”，即使模型仍选 fire_home，
         也不给内容。只拦内容类工具；lookup 允许（便于日志与后续判断）。 */
      if (
        ctx.policy &&
        ctx.policy.denyDanger &&
        args.scene === 'fire_home' &&
        (act === 'get_steps' || act === 'get_daily' || act === 'triage')
      ) {
        lg('info', '否定闸：明确否认火灾，拒绝 fire_home 内容', {
          from: act,
          scene: args.scene,
        });
        return runOne(
          { act: 'refuse', args: { reason: 'denied-fire' }, why: 'policy-denied-fire' },
          i,
          planList
        );
      }

      /* 儿科溺水：drowning 条目是通用成人流程，儿童参数未覆盖 → dial 120。
         模型即使选了 drowning，也不能给儿童套用。 */
      if (
        (act === 'get_steps' || act === 'triage') &&
        args.scene === 'drowning' &&
        R &&
        R.isCprOutOfScope &&
        R.isCprOutOfScope(text) === 'pediatric'
      ) {
        lg('info', '儿科溺水：改拨号 120');
        return runOne(
          { act: 'dial', args: { number: '120' }, why: 'pediatric-drowning' },
          i,
          planList
        );
      }

      /* CPR 范围闸（docs/14 V4 C11/C12）：模型即使选 cpr，婴儿/儿童/溺水也不许出成人步骤。
         离线 planRule 已做同样判断；这里补在线模型路径，防止两路分叉。
         只拦 steps/triage：turn=plan 的 cpr 咨询应在下面降级为 get_daily，不能误拨号。 */
      if (
        (act === 'get_steps' || act === 'triage') &&
        args.scene === 'cpr' &&
        R &&
        R.isCprOutOfScope &&
        planned.turn !== 'plan' &&
        !(ctx.policy && ctx.policy.type === 'plan')
      ) {
        var cprScope = R.isCprOutOfScope(text);
        if (cprScope === 'drowning' && ctx.entries.drowning) {
          /* 溺水条目已发布：不套成人 cpr，但也不该只给拨号卡。
             先补 drowning 的 lookup，再把本步改成 drowning 的 get_steps。
             儿科溺水（isCprOutOfScope 返回 pediatric）仍走下面的 dial。 */
          var dl = T.execute(
            'lookup_scene',
            { scene: 'drowning' },
            { entries: ctx.entries, sceneIds: ctx.sceneIds, history: history }
          );
          if (dl.ok) {
            steps.push({
              act: 'lookup_scene',
              args: { scene: 'drowning' },
              ok: true,
              result: dl.result || null,
              why: 'cpr-to-drowning',
            });
            history.push({
              act: 'lookup_scene',
              args: { scene: 'drowning' },
              result: dl.result || null,
            });
            planList[i] = {
              act: 'get_steps',
              args: { scene: 'drowning' },
              why: 'cpr-out-of-scope-drowning',
              turn: planned.turn,
              evidence: planned.evidence,
            };
            lg('info', 'CPR 范围闸：溺水改走 drowning 条目', {});
            return step(i, planList);
          }
        }
        if (cprScope) {
          lg('info', 'CPR 范围闸：主体超出成人范围，改拨号', { scope: cprScope });
          return runOne(
            { act: 'dial', args: { number: '120' }, why: 'cpr-out-of-scope:' + cprScope },
            i,
            planList
          );
        }
      }

      /* 大出血精度闸（docs/14 V4 C10）：少量出血/划破皮不是大出血。
         模型可能因「血」字选 severe_bleeding；这里在出内容前拦住。 */
      if (
        (act === 'get_steps' || act === 'triage' || act === 'get_daily') &&
        args.scene === 'severe_bleeding' &&
        R &&
        R.isMinorBleeding &&
        R.isMinorBleeding(text)
      ) {
        lg('info', '大出血精度闸：少量出血，拒绝 severe_bleeding 内容');
        return runOne(
          { act: 'refuse', args: { reason: 'minor-bleeding' }, why: 'minor-bleeding' },
          i,
          planList
        );
      }

      /* 回合策略：优先级 = 模型 turn > 本地 policy。
         模型 turn 来自 /act 的 turn 字段（2026-11-21 新契约）；
         本地 policy 是兜底（模型没给 / 离线 / 旧缓存）。
         turn=plan 禁 steps/triage/dial；turn=off_scope 只许 refuse。 */
      var modelTurn = planned.turn || null;
      var policyTurn = ctx.policy && ctx.policy.type ? ctx.policy.type : null;
      var turn = modelTurn || policyTurn;
      var allowSteps =
        turn === 'plan' || turn === 'off_scope'
          ? false
          : turn === 'ongoing'
            ? true
            : ctx.policy
              ? ctx.policy.allowSteps !== false
              : true;

      if (turn === 'off_scope' && act !== 'refuse') {
        lg('info', '回合策略：off_scope 强制 refuse', { from: act, turn: turn });
        return runOne(
          { act: 'refuse', args: { reason: 'turn-off-scope' }, why: 'policy-turn' },
          i,
          planList
        );
      }

      if (allowSteps === false && (act === 'get_steps' || act === 'triage' || act === 'dial')) {
        if (args.scene && ctx.entries[args.scene]) {
          lg('info', '回合策略：降级为 get_daily', {
            from: act,
            scene: args.scene,
            turn: turn,
            evidence: planned.evidence || null,
          });
          return runOne(
            { act: 'get_daily', args: { scene: args.scene }, why: 'policy-downgrade' },
            i,
            planList
          );
        }
        return runOne(
          { act: 'refuse', args: { reason: 'policy-no-entry' }, why: 'policy-refuse' },
          i,
          planList
        );
      }

      return runOne(planned, i, planList);
    }

    function runOne(planned, i, planList) {
      var act = planned.act;
      var args = planned.args || {};
      var T2 = tools();
      var res = T2.execute(act, args, {
        entries: ctx.entries,
        sceneIds: ctx.sceneIds,
        history: history,
      });

      var rec = {
        act: act,
        args: args,
        ok: res.ok,
        result: res.result || null,
        why: planned.why || null,
        turn: planned.turn || null,
        evidence: planned.evidence || null,
      };
      steps.push(rec);
      // history 只记「真的执行过」的动作 —— 被门拒绝的不进 history，
      // 否则后续前置条件会把「被拒的 lookup」当成「查过了」。
      if (res.ok) history.push({ act: act, args: args, result: res.result });

      if (o.onStep) {
        try {
          o.onStep(rec, res);
        } catch (e) {
          lg('warn', 'onStep 回调抛错（已忽略，不影响循环）', { error: String(e && e.message) });
        }
      }
      if (o.exec) {
        try {
          o.exec(rec, res);
        } catch (e) {
          lg('warn', 'exec 回调抛错，降级', { error: String(e && e.message) });
        }
      }

      if (!res.ok) return finishSafe('exec-failed');
      if (res.ends) {
        end = res.kind;
        return Promise.resolve(summary('ended'));
      }

      // 非终态：继续下一步。ask 需要等用户，循环在此暂停（由 UI 重新进入）
      if (res.kind === 'ask') {
        /* ⚠️ 2026-11-19 修：原来只 return summary('waiting-user')，**没有设 end**，
           于是 summary 里 endKind = null、ok = false。
           后果不是功能坏（app.js 用 host 判断有没有产出，不靠 endKind），
           而是**统计与日志失明**：probe_multi_turn 把它记成 unknown，
           看起来像「模型给不出动作」，实际是「模型正确地追问了」。
           这类「功能正常但观测不到」的缺陷最难查，所以必须让 endKind 如实反映。

           ask 算「有产出」：用户在屏幕上确实看到了一张追问卡。 */
        end = 'ask';
        return Promise.resolve(summary('waiting-user'));
      }
      // triage 会把用户带到新的一轮（用户点选后重新 run），此处结束即可
      if (res.kind === 'triage') {
        end = 'triage';
        return Promise.resolve(summary('ended'));
      }
      return step(i + 1, planList);
    }

    /* 同参重复调用检测（docs/03 §2.5.7 的「上限」）。
       返回 true 表示「这一动作与历史里某次完全相同」。

       ⚠️ 判据的成立范围（写清楚，否则下一个人会以为它管所有工具）：
         能重复到达这里的**只有非终态工具**，即 lookup_scene 与 ask。
         终态工具（get_steps / get_daily / dial / refuse）执行完就 return，
         根本回不到 step()，所以不需要它们参与判断。
         · lookup_scene 是纯查询：参数相同 → 结果必然相同 → 同参即「无新信息」
         · ask 走的是 WAIT_USER，一次会话只允许问一次（§2.5.2），到不了第二次

       所以「同参」在 lookup_scene 上等价于「同参且同观察」，
       不需要额外比较 result —— 那不是简化，是这两个条件的合流。
       若将来新增一个**有副作用且可能返回不同结果**的探查工具，
       这里必须改成真正比较 result，否则会误杀合法的重试。 */
    function isRepeatedAct(act, args, hist) {
      if (act !== 'lookup_scene') return false;
      var argKey = JSON.stringify(args || {});
      for (var k = 0; k < hist.length; k++) {
        if (hist[k].act === act && JSON.stringify(hist[k].args || {}) === argKey) return true;
      }
      return false;
    }

    function finishSafe(reason) {
      var T3 = tools();
      // 已经在终态输出过就不再补
      if (end) return Promise.resolve(summary('already-ended'));
      var res = T3.execute(
        'refuse',
        { reason: reason },
        { entries: ctx.entries, sceneIds: ctx.sceneIds, history: history }
      );
      var rec = {
        act: 'refuse',
        args: { reason: reason },
        ok: true,
        result: res.result,
        why: 'safe-exit',
      };
      steps.push(rec);
      history.push({ act: 'refuse', args: { reason: reason }, result: res.result });
      if (o.exec) {
        try {
          o.exec(rec, res);
        } catch (e) {
          lg('warn', '安全出口渲染失败', { error: String(e && e.message) });
        }
      }
      end = 'refuse';
      degraded = true;
      return Promise.resolve(summary(reason));
    }

    function summary(reason) {
      return {
        ok: !!end,
        steps: steps,
        endKind: end,
        degraded: degraded,
        reason: reason,
        history: history,
      };
    }

    /* 入口：计划有三种来源，优先级从高到低
       ① opts.plan  —— 调用方已算好（如 app.js 消费 LLM 判定结论后映射而来）
       ② opts.decide —— 探查类交给模型（真·自主循环，需要代理 /act 端点）
       ③ 都没有      —— 纯规则计划（离线 / 降级）

       ⚠️⚠️ 2026-11-19 踩过的坑（e2e_llm 里 4 条预防/库外问题全变 steps 卡）：
       第一版让 detectDanger **无条件优先**，结果「怎么预防煤气泄漏」因为含「煤气」
       被判成紧急，把 LLM 已经判对的 prevention 盖掉 —— 这正是 llm.js 在
       2026-11-18 修过的同一个 bug（L3 那 40% 误纳率被原样搬进 LLM 路径）。

       正确优先级：
         **有 LLM 判定结论（o.plan）时，以 LLM 为准，detectDanger 不得覆盖。**
         detectDanger 只在「没有模型结论」时才当第一道判定 —— 即离线/降级路径。
       这与 docs/03 §3.7「紧急关键词先判」不冲突：那条说的是**离线或模型不可用时**的
       第一道判定，不是「永久凌驾于模型之上」。

       代价（如实记）：在线模式下紧急场景仍有 1 次 LLM 往返（实测 683–1627ms），
       不是 0 次。真正零往返的只有离线/降级路径与点图标路径。 */
    var R = global.RETRIEVAL;
    var danger = R && R.detectDanger ? R.detectDanger(text) : null;
    var hasDecide = typeof o.decide === 'function';

    if (o.plan && o.plan.length) {
      lg('debug', '使用调用方给定计划（模型结论优先，不被关键词覆盖）', {
        steps: o.plan.length,
        dangerAlsoHit: danger ? danger.id : null,
      });
      return step(0, o.plan);
    }

    /* ⚠️ 离线判断必须在 hasDecide 之前：
       断网时 decide 一定会失败（fetch 抛错），让它先跑一次只是白等 2.5 秒超时，
       而且会让「离线」这件事被当成「模型出错」。先判网络，直接走规则计划。 */
    if (netState() === 'offline') {
      lg('info', '离线模式，走规则计划（不尝试调用模型）');
      degraded = true;
      return step(0, planRule(text, ctx));
    }

    /* ⚠️⚠️⚠️ 2026-11-19 同一个坑踩了三次，每次症状都是「预防咨询变急救步骤卡」：
         第 1 次 detectDanger 无条件优先 → 「怎么预防煤气泄漏」被「煤气」命中
         第 2 次 改成 o.plan 优先，但 decide 路径仍让 detectDanger 抢先
         第 3 次 想用 detectDanger 给 refuse 兜底 → 「煤气费怎么交」又被命中

       根因一句话：**关键词只看字面，模型能看语义；在线时前者优先级必须低于后者。**
       「怎么预防煤气泄漏」与「煤气费怎么交」都含「煤气」，字面无法区分，
       只有模型分得清「问预防」和「问缴费」。这正是 docs/08 §5.1 记录的
       L3 字符匹配硬缺陷 —— 同样的错误不该在工具层再犯。

       安全性依据（不是空口）：模型在 emergency 组实测 40/40（docs/03 §6），
       不依赖关键词也全对；库外由 e2e 的 30 条 off_scope 用例兜住；
       真出事时用户还能点图标（不过判定层，直接出步骤卡，§3.3 兜底路径）。 */
    if (hasDecide) {
      lg('debug', '在线自主循环：由模型逐步选工具', {
        dangerAlsoHit: danger ? danger.id : null,
        note: 'detectDanger 在此路径不参与决策',
      });
      // 哨兵：act 为 null 表示「这一步让模型现场决定」
      return step(0, [{ act: null, args: {}, why: 'decide-first' }]);
    }

    if (danger) {
      lg('debug', '无模型结论且紧急命中，走规则计划', { dangerId: danger.id });
      return step(0, planRule(text, ctx));
    }

    return buildPlan(text, ctx, o.decide).then(function (planList) {
      return step(0, planList);
    });
  }

  global.AGENT = {
    run: run,
    planRule: planRule,
    netState: netState,
    MAX_STEPS: MAX_STEPS,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · 入口（路由 / 绑定 / 启动）
   2026-11-19 从 1022 行拆出，依据 docs/10 §7「往 app.js 加大功能时必须先拆」。
   拆分后本文件只做四件事：路由决策、模式切换、DOM 绑定、启动与导出。

   已迁出的部分（行为不变，只是搬家）：
     渲染（renderSteps / renderStepsCard / renderDaily / renderRefuse /
           renderDialOnly / esc）      → app/render.js
     朗读（speakSteps / autoRead* / speakDaily / speakTriage /
           muteAutoRead / showVoiceNotice）→ app/speak.js
     语音输入（initTalk / onTalkUp / clearInput / talkCtl）→ app/talk.js
     共享可变状态（mode / locked / autoRead / talk）    → app/state.js
