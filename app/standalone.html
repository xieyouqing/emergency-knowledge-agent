<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安伴 · 应灾智能助手</title>
<style>
/* =========================================================
   应急助手 · M1 界面样式
   设计约束（对应 docs/01-需求基线 §6、§5）：
   - 最小字号 ≥ 24pt。CSS 按 96dpi 换算：24pt = 32px，故 --fs-min 取 32px。
     浏览器 computed style 读到的 px 值必须 ≥ 32，才是真的满足 24pt。
   - 打勾点击区 ≥ 48×48 px，实测值写在 .step 的 min-height / padding。
   - 浅底深字高对比：老人视力下降 + 烟雾环境下屏幕反光会盖住深色界面。
     不用深色主题，这是产品需求，不跟 IDE 主题走。
   - 不用渐变色、不用半透明文字，所有对比度 ≥ 7:1。
   ========================================================= */

:root{
  --fs-min: 32px;     /* 24pt，全局下限 */
  --fs-step: 34px;
  --fs-h1: 46px;
  --fs-h2: 38px;
  --fs-icon-label: 32px;

  --ink: #11151C;
  --ink-2: #3D4450;
  --bg: #FFFFFF;
  --surface: #F4F7FB;
  --surface-blue: #EAF2FF;
  --bg-soft: #F1F3F6;
  --line: #C9CFD8;

  --sos: #B3261E;         /* 警示红：紧急带、绝对不要做 */
  --sos-dark: #8C1D17;
  --act: #14488F;         /* 立刻做：蓝 */
  --next: #3D4450;        /* 接着做：中性 */
  --done: #1E6B3A;        /* 已完成：绿 */

  --tap: 56px;            /* 主按钮最小高度 */
  --disclaimer-stack: 72px;
}

*{ box-sizing: border-box; }

html,body{
  margin:0; padding:0;
  background: var(--surface);
  color: var(--ink);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  font-size: var(--fs-min);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ---------- 常驻免责（S6） ---------- */
.disclaimer{
  position: sticky; top: 0; z-index: 30;
  background: var(--ink);
  color: #FFFFFF;
  font-size: var(--fs-min);
  padding: 8px 24px;
  min-height: var(--disclaimer-stack);
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
  letter-spacing: .01em;
}

/* ---------- 紧急模式色带（S8） ---------- */
.mode-band{
  position: sticky; top: var(--disclaimer-stack); z-index: 29;
  display:flex; align-items:center; gap:14px;
  background: var(--sos);
  color:#FFFFFF;
  font-size: var(--fs-min);
  font-weight: 900;
  letter-spacing: .02em;
  padding: 18px 20px;
  border-bottom: 8px solid var(--sos-dark);
  box-shadow: 0 6px 18px rgba(140,29,23,.28);
}
.mode-band[hidden]{ display:none; }
.band-dot{
  width: 20px; height: 20px; border-radius: 50%;
  background:#FFFFFF; flex: 0 0 auto;
}

/* ---------- 布局 ---------- */
main{
  max-width: 1040px;
  margin: 0 auto;
  /* 底部留出固定输入区的高度，否则最后一条消息会被输入区盖住。
     高度由 .composer 决定（约 240px，含两行按钮与语速），这里多留 20px 余量。 */
  padding: 28px 24px calc(var(--composer-h) + 36px + env(safe-area-inset-bottom, 0px));
  /* 让 #msgScroll 能撑满可见高度并独立滚动 */
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.view[hidden]{ display:none; }

/* ---------- 消息流（2026-11-19 聊天式改造） ----------
   为什么内容区单独滚动而不是整页滚动：
     输入区固定在底部（用户裁决「永久显示」），若整页滚动，
     输入区会随页面移动，老人回看时要先滚回来才能再问一句。
   --composer-h 是输入区实际高度，padding-bottom 引用它可避免被遮挡。 */
:root{ --composer-h: 280px; }

.msg-scroll{
  flex: 1 1 auto;
  overflow-y: auto;
  scroll-padding-bottom: calc(var(--composer-h) + 24px);
  -webkit-overflow-scrolling: touch;
}
.msg-flow{
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* 一条消息 = 一个气泡。
   对齐规则：用户消息靠右（浅底），助手消息靠左（白底 + 边框）。
   为什么用左右区分而不是头像：老人不需要认头像，位置差异一眼可辨。 */
.msg{
  max-width: 100%;
  padding: 22px 24px;
  border-radius: 24px;
  border: 2px solid transparent;
  overflow-wrap: anywhere;
  scroll-margin-top: calc(var(--disclaimer-stack) + 24px);
}
.msg-user{
  align-self: flex-end;
  max-width: 85%;
  background: var(--bg-soft);
  border-color: var(--line);
  border-bottom-right-radius: 6px;
}
.msg-assistant{
  align-self: stretch;
  background: var(--bg);
  border-color: transparent;
  box-shadow: 0 8px 24px rgba(17,21,28,.06);
  border-bottom-left-radius: 10px;
}
#welcomeMsg{
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(320px, .92fr);
  column-gap: 30px;
  align-items: start;
  padding: 30px;
  background: var(--surface-blue);
  border: 0;
  border-left: 12px solid var(--act);
  box-shadow: 0 12px 30px rgba(20,72,143,.12);
}
#welcomeMsg .chat-greeting,
#welcomeMsg .chat-sub,
#welcomeMsg .voice-priority{ grid-column: 1; }
#welcomeMsg .icons{
  grid-column: 2;
  grid-row: 1 / span 3;
  margin: 0;
}
#welcomeMsg .brand-wordmark{
  font-size: 58px;
  line-height: 1.08;
  font-weight: 900;
  letter-spacing: .12em;
  color: var(--act);
  margin: 0 0 10px;
}
.brand-wordmark span{
  font-size: 30px;
  letter-spacing: .04em;
  color: var(--ink-2);
  margin-left: 12px;
  font-weight: 700;
}
#welcomeMsg .brand-wordmark{ grid-column: 1; margin-top: 0; }
.chat-greeting{ margin-top: 0; }
#welcomeMsg .chat-sub{ margin-bottom: 18px; }
.voice-priority{
  margin: 0;
  padding: 12px 16px;
  border-left: 8px solid #E29B00;
  background: #FFF8E6;
  color: var(--ink);
  font-size: var(--fs-min);
  font-weight: 800;
  line-height: 1.4;
}
/* 紧急消息：左侧红条 + 浅红底。
   为什么不用整块红底：整块红会让长文本对比度下降，老人看不清。
   红色只做「标记」用，不侵占阅读区。 */
.msg-assistant.is-emergency{
  border-left: 10px solid var(--sos);
  background: #FFF7F6;
}
/* D-11 = A（2026-11-20）：进入紧急后，旧助手消息保留但置灰、不可交互。
   为什么不用 display:none：老人还要能回看自己刚才看到过什么。
   为什么不用 pointer-events:none 在容器上：子元素仍会接事件，必须覆盖到 *。 */
.msg.is-old-locked{
  opacity: .62;
  filter: grayscale(1);
  cursor: default;
}
.msg.is-old-locked *{
  pointer-events: none !important;
}
.msg-notice{
  align-self: stretch;
  background: #FFF9E6;
  border-color: #E6C34A;
  font-size: var(--fs-min);
}
.msg-notice.is-warn{
  background: #FFF1F0;
  border-color: var(--sos);
}
.msg-text{ margin: 0; }
/* 消息里的标题不再是页面级大标题，降一档，避免每条消息都像首屏 */
.msg .ask-title{
  font-size: var(--fs-h2);
  margin: 0 0 16px;
}

/* ---------- 输入区（常驻底部） ---------- */
.composer{
  position: fixed;
  left: 50%; right: auto; bottom: 16px;
  width: min(calc(100% - 32px), 1040px);
  transform: translateX(-50%);
  z-index: 20;
  background: var(--bg);
  border: 3px solid var(--line);
  border-radius: 24px;
  padding: 16px;
  box-shadow: 0 14px 36px rgba(17,21,28,.18);
}
/* 输入区内容与消息流同宽同边距，视觉上对齐 */
.composer > *{
  max-width: none;
  margin-left: auto;
  margin-right: auto;
}
/* 紧急态：输入区顶边变红，与消息红条呼应（S8 的可见性不靠隐藏视图） */
body.is-emergency .composer{
  border-color: var(--sos);
  background: #FFF7F6;
}
/* 紧急链路遵循「全程零文字输入」：识别结果仍会作为用户消息留在消息流中，
   但底部只保留按住说话，避免老人误以为还要打字确认。 */
body.is-emergency #emgForm{ display: none !important; }
/* 输入区里的间距比消息流小：这块是操作区，不是阅读区 */
.composer .ask-row{ margin-bottom: 12px; }
.composer .voicein-row{ margin-bottom: 12px; }
/* 每步可见进展（M2.5）：与输入区同宽，字号不低于全局下限 */
.progress{
  font-size: var(--fs-min);
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  color: #FFFFFF;
  background: var(--act);
  border-radius: 12px;
  padding: 10px 16px;
  margin-bottom: 12px;
}
body.is-emergency .composer .progress{ background: var(--sos); }
/* hidden 必须真正隐藏：flex 布局下 [hidden] 会被 display:flex 覆盖 */
.composer [hidden]{ display: none !important; }

.ask-title, .sos-title{
  font-size: var(--fs-h1);
  line-height: 1.25;
  margin: 16px 0 24px;
  font-weight: 800;
}
.chat-greeting{
  font-size: var(--fs-h2);
  line-height: 1.3;
  font-weight: 800;
  margin: 4px 0 10px;
}
.chat-sub{
  font-size: var(--fs-min);
  line-height: 1.55;
  color: var(--ink-2);
  margin: 0 0 8px;
}
.sos-title{ color: var(--sos); }

/* ---------- 输入区 ---------- */
.ask-row{
  display: flex; gap: 12px; align-items: stretch;
  margin-bottom: 28px;
  padding: 10px;
  border-radius: 18px;
  background: var(--surface);
}

/* ---------- 按住说话（M2 语音输入） ----------
   独立一行放在输入框下方：打字仍是最可靠路径，语音给不会打字的老人。
   尺寸与 .voice-btn 同口径（≥76px 高、字号走 --fs-min），
   老人手指粗、手抖，不能做成小圆钮。 */

.voicein-row{
  /* 必须保留左右 auto：.composer > * 用 auto 居中，
     这里若写 margin 简写会把左右重置为 0，麦克风按钮就会左对齐、
     和下面输入框的边框对不齐（用户 2026-11-21 报的「不会拉长填充」）。 */
  margin: 0 auto 12px;
}
.talk-btn{
  display: flex; align-items: center; justify-content: center; gap: 14px;
  width: 100%;
  min-height: 84px;
  font-size: var(--fs-min);
  font-weight: 800;
  font-family: inherit;
  color: #FFFFFF;
  background: var(--act);
  border: 3px solid var(--act);
  border-radius: 18px;
  letter-spacing: .04em;
  cursor: pointer;
  /* 长按时不选中文字、不弹系统菜单 */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
.talk-btn:active,
.talk-btn.is-rec{
  background: var(--sos);
  border-color: var(--sos-dark);
  color: #fff;
}
.talk-btn.is-busy{
  background: var(--line);
  color: var(--ink-2);
  cursor: progress;
}
/* 录音中：按钮轻微呼吸，明确「正在听」 */
.talk-btn.is-rec{ animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse{
  0%,100%{ box-shadow: 0 0 0 0 rgba(179,38,30,.55); }
  50%    { box-shadow: 0 0 0 12px rgba(179,38,30,0); }
}
.talk-btn:disabled{ cursor: not-allowed; }
.sos-talk{ background: var(--sos); border-color: var(--sos); }

.talk-hint{
  margin: 12px 0 0;
  font-size: var(--fs-min);
  color: var(--sos-dark);
  line-height: 1.45;
}
.talk-hint.is-info{ color: var(--ink-2); }

/* 识别中：进度条式的确定性反馈，避免「无反馈等待」（01 §8 红线 1） */
.talk-progress{
  height: 8px; margin-top: 12px; border-radius: 4px;
  background: var(--line); overflow: hidden;
}
.talk-progress::after{
  content: ''; display: block; height: 100%; width: 40%;
  background: var(--act);
  animation: slide 1.2s ease-in-out infinite;
}
@keyframes slide{
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

.ask-input{
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--tap);
  font-size: var(--fs-min);
  font-family: inherit;
  color: var(--ink);
  background: var(--bg-soft);
  border: 3px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
}
.ask-input:focus{
  outline: none;
  border-color: var(--act);
  background: #FFFFFF;
  box-shadow: 0 0 0 4px rgba(20,72,143,.18);
}
.ask-input::placeholder{ color:#6B7280; }

.ask-btn{
  flex: 0 0 auto;
  min-height: var(--tap);
  min-width: 120px;
  font-size: var(--fs-min);
  font-family: inherit;
  font-weight: 700;
  color:#FFFFFF;
  background: var(--act);
  border: none;
  border-radius: 14px;
  padding: 14px 22px;
  cursor: pointer;
}
.sos-btn{ background: var(--sos); }
.ask-btn:active{ transform: translateY(1px); }

.ask-btn:focus-visible,
.talk-btn:focus-visible,
.icon-btn:focus-visible,
.icon-more:focus-visible,
.dial-btn:focus-visible,
.step:focus-visible{
  outline: 4px solid #F0A400;
  outline-offset: 3px;
}

.section-label{
  font-size: var(--fs-min);
  color: var(--ink-2);
  margin: 8px 0 16px;
}

/* ---------- 场景入口：文字按钮，不用 emoji ---------- */
.icons{
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 0;
}
.icon-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-width: 0;
  min-height: 92px;
  padding: 14px 14px 14px 20px;
  font-family: inherit;
  font-size: var(--fs-min);
  font-weight: 700;
  color: var(--ink);
  background: #FFFFFF;
  border: 3px solid var(--line);
  border-left: 12px solid var(--act);
  border-radius: 18px;
  cursor: pointer;
  line-height: 1.25;
  text-align: left;
}
.icon-btn:nth-child(2){ border-left-color: #B3261E; }
.icon-btn:nth-child(3){ border-left-color: #B7791F; }
.icon-btn:nth-child(4){ border-left-color: #1E6B3A; }
.icon-btn:active{ background: #E3E7ED; }
/* 首屏只放前 4 个常用场景，其余收起，避免一次铺开 */
.icons:not(.is-expanded) .icon-btn.is-extra{ display: none; }
.icon-more{
  grid-column: 1 / -1;
  width: 100%;
  min-height: 76px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: var(--fs-min);
  font-weight: 700;
  color: var(--act);
  background: #FFFFFF;
  border: 2px dashed var(--act);
  border-radius: 16px;
  cursor: pointer;
  line-height: 1.25;
}
.icon-label{ text-align: center; }

/* ---------- 回答区 ---------- */
.answer-area{ margin-top: 8px; }

.card{
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 24px;
  background: #FFFFFF;
}
.card-title{
  font-size: var(--fs-h2);
  font-weight: 800;
  margin: 0 0 6px;
}
.card-sub{
  font-size: var(--fs-min);
  color: var(--ink-2);
  margin: 0 0 18px;
}
/* 解释行：为什么先处理这件事（2026-11-20）
   与 .card-sub 的区别只在左边一道竖线 —— 让老人一眼看出
   「这是说明，不是要做的事」，避免把解释误读成步骤（S1 关注点）。
   字号必须用 --fs-min（32px），不允许缩小：这是正文级信息，
   本项目不使用小于 24pt 的字（docs/01 §6 判据 10）。 */
.card-note{
  font-size: var(--fs-min);
  color: var(--ink-2);
  line-height: 1.5;
  margin: 0 0 20px;
  padding-left: 16px;
  border-left: 6px solid #C9D2DD;
}

/* 三段式 */
.seg{ margin: 0 0 26px; }
.seg:last-of-type{ margin-bottom: 8px; }
.seg-head{
  display:flex; align-items:center; gap: 12px;
  font-size: var(--fs-h2);
  font-weight: 800;
  margin: 0 0 12px;
}
.seg-head .bar{
  width: 10px; align-self: stretch; min-height: 30px; border-radius: 4px;
}
.seg-immediate .bar{ background: var(--act); }
.seg-next .bar{ background: var(--next); }
.seg-never .bar{ background: var(--sos); }
.seg-immediate .seg-head{ color: var(--act); }
.seg-next .seg-head{ color: var(--next); }
.seg-never .seg-head{ color: var(--sos); }

.steps{ list-style: none; margin:0; padding:0; }
.steps li{ margin: 0 0 12px; }

/* 打勾按钮：点击区 ≥ 48×48（实测 min-height 76px） */
.step{
  display:flex; align-items: flex-start; gap: 16px;
  width: 100%;
  min-height: 76px;
  padding: 16px 18px;
  font-family: inherit;
  font-size: var(--fs-step);
  line-height: 1.4;
  text-align: left;
  color: var(--ink);
  background: var(--bg-soft);
  border: 3px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
}
.step .box{
  flex: 0 0 auto;
  width: 48px; height: 48px;
  border: 4px solid var(--ink-2);
  border-radius: 10px;
  background: #FFFFFF;
  display:flex; align-items:center; justify-content:center;
  font-size: 32px; font-weight: 900; color: #FFFFFF;
  line-height: 1;
}
.step[aria-pressed="true"]{
  background: #E8F3EC;
  border-color: var(--done);
}
.step[aria-pressed="true"] .box{
  background: var(--done);
  border-color: var(--done);
}
.step[aria-pressed="true"] .txt{
  color: var(--done);
  text-decoration: line-through;
  text-decoration-thickness: 3px;
}

/* 禁忌项不可打勾，样式上区别于步骤 */
.seg-never .step{
  cursor: default;
  background: #FDEDEC;
  border-color: var(--sos);
  color: var(--sos-dark);
  font-weight: 700;
}
.seg-never .step .box{
  border-radius: 50%;
  border-color: var(--sos);
  background: var(--sos);
  color: #FFFFFF;
  font-size: 34px;
}

/* ---------- 拨号 ---------- */
.dial-row{ margin-top: 22px; }
.dial-btn{
  display:flex; align-items:center; justify-content:center;
  min-height: 84px;
  width: 100%;
  font-size: 38px;
  font-weight: 800;
  color:#FFFFFF;
  background: var(--sos);
  border-radius: 16px;
  text-decoration: none;
  padding: 16px;
}
.dial-btn:active{ background: var(--sos-dark); }

/* ---------- 退出紧急（S8 显式退出，2026-11-20） ----------
   只在 ack 卡上出现；二次确认才真正退出。按钮必须够大，老人好点。 */
.ack-actions{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 22px;
}
.ack-actions button{
  min-height: 64px;
  flex: 1 1 220px;
  font-family: inherit;
  font-size: var(--fs-min);
  font-weight: 700;
  border-radius: 12px;
  padding: 12px 18px;
  cursor: pointer;
}
.ack-exit{
  color: #FFFFFF;
  background: var(--act);
  border: 3px solid var(--act);
}
.ack-exit:active{ background: #0E356B; }
.ack-exit-yes{
  color: #FFFFFF;
  background: var(--sos);
  border: 3px solid var(--sos);
}
.ack-exit-yes:active{ background: var(--sos-dark); }
.ack-exit-no{
  color: var(--ink);
  background: #FFFFFF;
  border: 3px solid var(--line);
}

/* ---------- 朗读（M2） ----------

     ② 默认级别 = WARN 以上

     A. **不许泄露密钥**。日志字段与 msg 都过一遍脱敏；代理侧收到也再脱一次，

     C. **提问原文只记前 40 字**。它是老人说的话，本地文件可留但不许全文堆积。

       ② 线上部署：代理同时托管 app/ 静态页，**一个端口**，且是 https

  function resolveApiBase() {

<script>
/* =========================================================

   依据：docs/03-技术方案.md §3 / §5

   为什么单独成文件（docs/03 §7.1 D-3 的连带改动）:
     三层引擎必须能被同一份 100 条评测集无差别调用，
     否则「测的」和「用的」是两套实现，数据没有决策价值。
     故检索逻辑全部收在此处，app.js 只负责 UI 与路由。

   三个引擎（全部同步、全部离线可用）:
     l3     字符规则分（离散：alias 10 / name 9 / keyword 4+k）
            ★ 生产默认。三层兜底的最底层，自带绝对判据
     bm25   中文 bigram 的 BM25（无界分，不能做绝对阈值）
     hybrid RRF 融合 l3 + bm25（相对排序，用于对照实验）

      当前 RETRIEVAL_ENGINE = 'l3'，与 M1 基线逐条一致。
   ========================================================= */
(function (global) {
  'use strict';

  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('retrieval');
    if (t[level]) t[level](msg, fields);
  }

  /* ---------- 危险信号关键词表（L3 的意图判定，非场景检索） ----------
     覆盖 index.json 全部 10 个场景的典型口语说法。
     number 取 docs/02-数据契约 §4.1 候选池表的「默认主推号码」，
     未发布场景没有条目可读，故在此写死。

     已知代价（不藏）：纯词命中即切紧急，所以「怎么预防燃气泄漏」
     这类日常提问也会切紧急。这是 docs/01 §3.0「策略 C：宁可多切，
     不做降级」的直接后果，不是实现缺陷。 */

  /* 命中顺序 = 优先级。数组靠前先命中即返回，所以顺序本身就是规则。

       判错方向比不答更危险。
       已验证「煤气漏了」「闻到煤气味」不含 co_poisoning 任何词，前移不会误伤。 */
  var DANGER_RULES = [
    { id: 'fire_home', number: '119', words: ['着火', '起火', '冒烟', '火灾', '火警', '烧起来', '着了', '烟很大', '有烟', '烧了', '扑火', '火势'] },
    { id: 'co_poisoning', number: '120', words: ['一氧化碳', '煤气中毒', '炭火', '烧炭', '炭盆', '煤炉', '头晕恶心', '头痛恶心', '中毒'] },
    { id: 'gas_leak', number: '119', words: ['燃气', '煤气', '天然气', '液化气', '漏气', '煤气味', '臭鸡蛋', '怪味', '异味', '气罐', '气瓶'] },
    { id: 'fall_elderly', number: '120', words: ['摔倒', '跌倒', '摔了', '起不来', '爬不起来', '摔伤', '跌了'] },
    /* 2026-11-18 修复 B1：补「烫起泡」类口语说法。
       原来只有「烫伤/开水烫/油烫/烫到/烫了」，「孩子被热水烫起泡了」一个都不含，

    { id: 'scald_burn', number: '120', words: ['烫伤', '烧伤', '烧烫伤', '开水烫', '热水烫', '油烫', '烫到', '烫了', '烫起泡', '烫出泡', '被烫', '烫红'] },
    { id: 'electric_shock', number: '120', words: ['触电', '电到', '电击', '漏电', '被电', '电伤'] },
    { id: 'airway_obstruction', number: '120', words: ['噎住', '噎着', '卡住喉咙', '卡喉', '呼吸困难', '喘不上', '呛到', '窒息', '异物'] },
    { id: 'drowning', number: '120', words: ['溺水', '落水', '掉水里', '淹了', '淹死', '水里捞'] },
    { id: 'earthquake', number: '119', words: ['地震', '余震', '房子塌', '楼塌', '震了', '晃动'] },

  var RETRIEVAL_ENGINE = 'l3';

     目前覆盖：不 / 没 / 别 / 未，「打不」单独处理（打不着火、打不燃）。 */
  var NEG_PREFIX = ['不', '没', '别', '未'];

  function hitNoNegation(text, word) {
    var w = norm(word);
    if (!w) return false;
    var idx = text.indexOf(w);
    while (idx !== -1) {
      var prev1 = idx > 0 ? text.charAt(idx - 1) : '';
      var prev2 = idx > 1 ? text.substr(idx - 2, 2) : '';
      var negated = NEG_PREFIX.indexOf(prev1) !== -1 || prev2 === '打不';
      if (!negated) return true;
      idx = text.indexOf(w, idx + 1);
    }
    return false;

          lg('debug', '危险信号命中', { rule: r.id, word: r.words[j], number: r.number });

        }
      }
    }
    lg('debug', '危险信号未命中');
    return null;
  }

     为什么不直接用 DANGER_RULES 做预置：
       DANGER_RULES 是**场景词**，含「煤气」「着火」这类字面词，
       「怎么预防煤气泄漏」也会命中。拿它预置 lookup 会把预防咨询
       预置成紧急场景，重演 2026-11-19 的旧 bug（三次踩坑，见 agent.js 注释）。

     两张表分工：
       SEVERE_WORDS  = 明确需要拨号的危重状态（无呼吸/心跳停/大出血）
       ONGOING_WORDS = 危险正在发生的进行时（漏了/着火了/倒地/被困）
     两张表都**不含**场景名词本身，且调用方还会再排除「预防/要不要/多久」类措辞。
     它们是 B 方案的**加速条件**，不是新的安全判据 —— 不命中就回落现有 2 次往返。 */
  var SEVERE_WORDS = [
    '没有呼吸', '没呼吸', '无呼吸', '呼吸停止', '呼吸停了',
    '心跳停止', '心跳停了', '没有脉搏', '无脉搏',
    '大出血', '流血不止', '止不住血'
  ];
  var ONGOING_WORDS = [
    '漏了', '在漏', '漏气',
    '着了', '着火', '起火', '冒烟', '烟很大', '有烟',
    '倒地', '倒在地上', '晕倒', '起不来', '爬不起来',
    '摔了', '摔倒', '跌了', '绊倒',
    '困在', '被困', '触电', '电到',
    '溺水', '落水', '掉水里',
    '噎住', '卡住喉咙',
    '烫了', '烫到', '被烫', '烫起泡',
    '流血不止', '止不住'
  ];

  function detectFrom(text, words) {
    var t = norm(text);
    for (var i = 0; i < words.length; i++) {
      if (hitNoNegation(t, words[i])) return words[i];
    }
    return null;
  }
  function detectSevere(text) {
    return detectFrom(text, SEVERE_WORDS);
  }
  function detectOngoing(text) {
    return detectFrom(text, ONGOING_WORDS);
  }

  /* ---------- CPR 范围外主体（2026-11-21，docs/14 §2.2 / §4.2 C11-C12） ----------

     要解决的实际错误：`cpr` 条目发布后，「婴儿没呼吸」「溺水没呼吸」直接拿到了
     成人 CPR 步骤（按压 5-6cm、30:2）。`14` §2.2 明确这两类本轮不做——
     婴幼儿的按压深度/手法/比例不同，溺水复苏的优先顺序也不同。

     ⚠️ 为什么必须在**发布后**才暴露出这个问题：
       cpr 未发布时，`planRule` 的 severe 分支查不到条目，落到 `dial 120`（安全兜底）；
       条目一发布，同一个分支立刻变成「无差别给成人步骤」。
       **是发布动作把兜底变成了越界，不是新增代码引入的。**

     代价说清（不藏）：
       「孩子」在中文口语里也可能指成年子女（「我孩子在外地工作」）。
       所以把它也列进来，会产生一种误判：成年子女无呼吸时只给拨号卡、不给按压步骤。
       这个误判的方向是**少给内容**（dial 120 仍是正确的第一动作），不是给错内容。
       反过来若不列，「孩子没呼吸」会拿到成人按压深度——那才是给错。
       两害相权取「少给」。 */
  var PEDIATRIC_WORDS = ['婴儿', '宝宝', '新生儿', '幼儿', '小孩', '儿童', '孩子'];
  var DROWNING_WORDS = ['溺水', '落水', '掉水里', '淹了', '淹死', '水里捞', '水中'];

  function isCprOutOfScope(text) {
    var t = norm(text);
    for (var i = 0; i < PEDIATRIC_WORDS.length; i++) {
      if (t.indexOf(PEDIATRIC_WORDS[i]) !== -1) return 'pediatric';
    }
    for (var j = 0; j < DROWNING_WORDS.length; j++) {
      if (t.indexOf(DROWNING_WORDS[j]) !== -1) return 'drowning';
    }
    return null;
  }

  /* 「叫不醒 / 没反应，但还有呼吸」：P20-c 条目未发布前只能拨号（docs/14 C5/C6）。
     为什么不能落 cpr：还有呼吸的人不需要胸外按压；也不能落 fall_elderly 分诊。 */
  var UNRESPONSIVE_RE = /叫不醒|叫不应|没反应|无反应|无意识|意识不清|昏迷/;
  var BREATHING_RE = /还有呼吸|有呼吸|呼吸正常|在呼吸|呼吸平稳/;
  function isUnresponsiveWithBreathing(text) {
    var t = norm(text);
    return UNRESPONSIVE_RE.test(t) && BREATHING_RE.test(t);
  }

  /* 轻微出血：少量、能止住、划破皮。不能因为出现「血」就走大出血条目。 */
  var MINOR_BLEEDING_RE = /没出多少血|没流多少血|一点点血|少量出血|小口子|划破|擦破|破了点皮/;
  function isMinorBleeding(text) {
    var t = norm(text);
    if (!MINOR_BLEEDING_RE.test(t)) return false;
    /* 同时明确说「止不住 / 大出血」时，仍按危重处理。 */
    return !/大出血|流血不止|止不住血|止不住/.test(t);
  }

  /* 「如果/万一/假如……怎么办」问的是预案，不是现在出事。
     为什么单独成一个判据而不是塞进 DANGER_RULES：
       「如果发生火灾怎么办」仍含「火灾」，但它不该触发紧急锁定；
       把否定/假设当成一种「场景」会让词表越来越糊。
     这个词表只影响路由，不改变任何条目的危险信号判定。 */
  var HYPOTHETICAL_RE = /如果|万一|假如|要是|倘若|假使/;
  function isHypothetical(text) {
    return HYPOTHETICAL_RE.test(norm(text));
  }

  /* 用户是否明确说「已经解除」。
     只用于「ack 之后自动退出紧急」这一道复核；模型误 ack 时不能把老人退出。
     不明确 → 保持紧急，只给单次点击兜底。 */
  var RESOLVED_RE =
    /已经.{0,4}(安全|没事|脱困|出来|得救)|安全了|没事了|脱困了|出来了|得救了|门开了|火灭了|灭了|缓过来了|不漏了|不漏气|没有危险了/;
  function isResolved(text) {
    var t = norm(text);
    /* 「应该没事了吧 / 好像安全了」是猜测，不是确认；规则 8 明确不算解除。 */
    if (/好像|可能|应该|也许|大概|是不是|不确定|似乎/.test(t)) return false;
    return RESOLVED_RE.test(t);
  }

  /* 用户是否明确否认“着火/火灾”这一类危险。
     为什么要单独一条：R30「不是着火，是锅烧糊了，冒点烟」里，
     “冒点烟”会让词表命中 fire_home；但用户已经明确否认火灾。
     这只处理「明确否认」，不处理模糊猜测；也不覆盖“没呼吸”等危重词。 */
  var DENIED_FIRE_RE = /不是(着|起|冒)?火|不是火灾|并非(着|起)火|没见明火|没有明火|没看到明火/;
  function isDeniedFire(text) {
    var t = norm(text);
    if (/好像|可能|应该|也许|大概|是不是|不确定|似乎/.test(t)) return false;
    return DENIED_FIRE_RE.test(t);
  }

  /* 回合策略（2026-11-20 用户裁决「工作流 + 自主决策」）：
     先用本地规则判「这一轮是在问预案/预防，还是现场正在发生」，
     再把这个结论作为**工具约束**交给 /act；模型仍在允许的工具里自主选。
     为什么不用再调一次 /judge：这是路由约束，不是语义判定；本地规则足够，
     且不增加首轮 3 秒预算的往返。

     只约束两种情况：
       hypothetical / prevention → allowSteps=false（禁 get_steps/triage/dial）
       ongoing / unknown          → allowSteps=true（保持自主）
     不试图判 off_scope —— 那仍交给模型/refuse，避免误伤「安全防护设备选购」。 */
  var PLAN_RE =
    /怎么预防|如何预防|怎么防止|如何避免|要不要|该不该|多久|注意事项|怎么选|有用吗|平时|日常检查|怎么检查/;

  function turnPolicy(text) {
    var t = norm(text);
    if (!t) return { type: 'unknown', allowSteps: true, denyDanger: false };
    var denyDanger = isDeniedFire(t);
    if (isHypothetical(t)) {
      return { type: 'hypothetical', allowSteps: false, denyDanger: denyDanger };
    }
    if (PLAN_RE.test(t)) {
      return { type: 'prevention', allowSteps: false, denyDanger: denyDanger };
    }
    var severe = detectSevere(t);
    var danger = detectDanger(t);
    var ongoing = detectOngoing(t);
    if (severe || (danger && ongoing)) {
      return { type: 'ongoing', allowSteps: true, denyDanger: denyDanger };
    }
    return { type: 'unknown', allowSteps: true, denyDanger: denyDanger };
  }

  /* B 方案的纯决策函数：只回答「首轮该不该本地预置、预置成什么」。
     为什么放在检索层而不是 app.js：它是**判定逻辑**，必须能脱离 DOM 离线测；
     app.js 只负责把结果翻译成 plan/history。
     返回：
       null                          → 不预置，走现有 2 次往返
       {kind:'dial', number, why}    → 本地直接拨号（0 次模型）
       {kind:'lookup', scene, why}   → 预置 lookup，模型 1 次决策出内容

     ⚠️ 预防类措辞优先排除：`怎么预防煤气泄漏` 含场景词，但不是在说事。 */
  /* 除预防外，还要排除「检查/平时/有没有」与事务性咨询（保险/理赔/投诉/费用）。
     依据 2026-11-20 开发集误报：P004「平时怎么检查有没有漏气」、
     O011「摔倒保险怎么理赔」都含进行时词，但不是在说「正在出事」。 */
  var PREVENTION_RE =
    /预防|防止|避免|要不要|多久|注意事项|安全吗|有用吗|怎么防|检查|平时|有没有|保险|理赔|投诉|缴费|费用|多少钱/;

  function seedDecision(text, entries) {
    var t = String(text || '');
    if (!t || PREVENTION_RE.test(t)) return null;

    if (isUnresponsiveWithBreathing(t)) {
      return { kind: 'dial', number: '120', why: 'unresponsive-breathing-no-entry' };
    }

    var severe = detectSevere(t);
    if (severe) {
      /* 2026-11-21：cpr / severe_bleeding 已发布，危重不再无条件拨号。
         与 planRule 同口径：婴儿/儿童/溺水不进成人 cpr → dial；其余查条目。
         条目没发布时仍然 dial（安全兜底不变）。 */
      var isBleeding = /大出血|流血不止|止不住血/.test(severe);
      var severeScene = isBleeding ? 'severe_bleeding' : 'cpr';
      var outOfScope = !isBleeding && isCprOutOfScope(t);
      /* 溺水的专属条目已发布：成人/未标明年龄的溺水走 drowning，
         不再因为「不能用成人 cpr」而一刀切拨号。儿科仍 dial（无儿科 CPR）。 */
      if (outOfScope === 'drowning' && entries && entries.drowning) {
        severeScene = 'drowning';
        outOfScope = null;
      }
      if (!outOfScope && (entries || {})[severeScene]) {
        return {
          kind: 'lookup',
          scene: severeScene,
          number: '120',
          why: 'severe-entry:' + severeScene,
        };
      }
      return { kind: 'dial', number: '120', why: 'severe:' + severe };
    }

    var danger = detectDanger(t);
    if (!danger) return null;
    var ongoing = detectOngoing(t);
    if (!ongoing) return null;

    var entry = (entries || {})[danger.id];
    if (!entry) {
      return { kind: 'dial', number: danger.number || '120', why: 'no-entry:' + danger.id };
    }
    return { kind: 'lookup', scene: danger.id, number: danger.number, why: 'ongoing:' + ongoing };
  }

  /* =========================================================
     引擎 A：L3 字符规则分
     离散分数自带绝对判据：top > 0 = 规则命中，top == 0 = 未命中。
     这是三层里唯一不需要分布假设的绝对判据（docs/03 §5.2）。
     ========================================================= */

  /* alias 命中 10 分（口语说法最可信）
     name  命中  9 分
     keyword 命中 4 + 命中个数（随个数增长，但低于 name）
     alias 反向包含 6 分（用户输入是别名的一部分，如输入「电梯」对上「电梯困住」）

     ⚠️ 正向匹配全部走 hitNoNegation，不用裸 indexOf。
        2026-11-18 回归修复：「汽车打不着火」含子串「着火」，
        fire_home 还没有条目时这条不会暴露（bestMatch 无从命中）；
        条目发布后立刻变成误判——detectDanger 有否定检查、这里没有，
        同一个词表两条路径检查不一致就是 bug。
        否定前缀只用于正向匹配；反向包含（a.indexOf(t)）是「用户输入更短」，
        不存在否定语义，故不检查。 */
  function scoreEntryByRules(entry, text) {
    var t = norm(text);
    var best = 0;
    var why = '';
    var aliases = entry.aliases || [];
    for (var i = 0; i < aliases.length; i++) {
      var a = norm(aliases[i]);
      if (!a) continue;
      if (hitNoNegation(t, a)) {
        if (best < 10) { best = 10; why = 'alias:' + aliases[i]; }
      } else if (a.indexOf(t) !== -1 && t.length >= 2) {
        if (best < 6) { best = 6; why = 'alias-rev:' + aliases[i]; }
      }
    }
    if (entry.name && best < 9 && hitNoNegation(t, entry.name)) {
      best = 9; why = 'name';
    }
    var kw = 0;
    (entry.keywords || []).forEach(function (k) {
      if (k && hitNoNegation(t, k)) kw++;
    });
    if (kw > 0) {
      var s = 4 + Math.min(kw, 4);
      if (s > best) { best = s; why = 'keyword*' + kw; }
    }
    return { score: best, why: best > 0 ? why : '' };
  }

  function rankByRules(entries, text) {
    var out = [];
    var detail = [];
    entries.forEach(function (e) {
      var r = scoreEntryByRules(e, text);
      // 逐条得分只在 debug 记：一次提问 9 条，落盘会淹没摘要
      if (r.score > 0) detail.push({ id: e.id, score: r.score, why: r.why });
      if (r.score > 0) out.push({ id: e.id, score: r.score, by: 'l3', why: r.why });
    });
    out.sort(function (x, y) { return y.score - x.score; });
    lg('debug', 'L3 规则打分', { hit: out.length, top: detail.slice(0, 3) });
    return out;
  }

  /* =========================================================
     引擎 B：BM25（中文 bigram）

     分词：不用词典，中文按二元组切（「煤气泄漏」→ 煤气/气泄/泄漏），
           ASCII 连续段整体成词（"120" → "120"）。
           选 bigram 而非单字：单字区分度太低（「电梯」与「电梯广告」
           共享「电」「梯」，反而放大误命中）。
           不引词典：3 条条目规模下，词典维护成本 > 收益（docs/03 §3.3）。

     检索单元：一条 entry = 一个单元（D1 整条），不切块。
           依据 docs/03 §3.1：切块触发条件是单场景字段 > 8KB 或挂载文档 ≥ 3，
           当前 3 条 entry 各 1–2KB，远未触发。

     检索文本字段：name + aliases + keywords（场景标识）。
           刻意不含 steps / daily —— 这一层的任务是「定位场景」，
           不是「找答案段落」。把 steps 拼进来会让「拨打」这类
           通用动词参与打分，反而稀释场景词权重。
     ========================================================= */
  var BM25_K1 = 1.2;
  var BM25_B = 0.75;
  var RRF_K = 60;

  function tokenize(text) {
    var s = String(text || '').toLowerCase();
    var out = [];
    var re = /[\u4e00-\u9fff]+|[a-z0-9]+/g;
    var m;
    while ((m = re.exec(s)) !== null) {
      var seg = m[0];
      if (/^[a-z0-9]+$/.test(seg)) { out.push(seg); continue; }
      if (seg.length === 1) { out.push(seg); continue; }
      for (var i = 0; i + 1 < seg.length; i++) out.push(seg.substr(i, 2));
    }
    return out;
  }

  function searchableText(entry) {
    var parts = [];
    if (entry.name) parts.push(entry.name);
    (entry.aliases || []).forEach(function (a) { parts.push(a); });
    (entry.keywords || []).forEach(function (k) { parts.push(k); });
    return parts.join(' ');
  }

  var _idxCache = { key: '', idx: null };

  function buildIndex(entries) {
    var key = entries.map(function (e) { return e.id; }).join(',');
    if (_idxCache.key === key && _idxCache.idx) return _idxCache.idx;

    var docs = [];
    var df = {};
    var totalLen = 0;
    entries.forEach(function (e) {
      var tokens = tokenize(searchableText(e));
      var tf = {};
      tokens.forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
      docs.push({ id: e.id, tf: tf, len: tokens.length });
      Object.keys(tf).forEach(function (t) { df[t] = (df[t] || 0) + 1; });
      totalLen += tokens.length;
    });

    var idx = {
      docs: docs,
      df: df,
      N: docs.length,
      avgdl: docs.length ? totalLen / docs.length : 0
    };
    _idxCache = { key: key, idx: idx };
    return idx;
  }

  function rankByBM25(entries, text) {
    var idx = buildIndex(entries);
    var qTokens = tokenize(text);
    if (!qTokens.length || !idx.N) return [];

    // query 去重，避免同一 bigram 重复计分
    var seen = {};
    var q = qTokens.filter(function (t) {
      if (seen[t]) return false;
      seen[t] = true;
      return true;
    });

    var out = [];
    idx.docs.forEach(function (d) {
      var score = 0;
      var hits = [];
      q.forEach(function (t) {
        var f = d.tf[t] || 0;
        if (!f) return;
        var n = idx.df[t] || 0;
        // IDF：加 1 保证非负（Lucene 写法），3 条文档时也不会出现负权重
        var idf = Math.log(1 + (idx.N - n + 0.5) / (n + 0.5));
        var denom = f + BM25_K1 * (1 - BM25_B + BM25_B * (d.len / (idx.avgdl || 1)));
        score += idf * (f * (BM25_K1 + 1)) / (denom || 1);
        hits.push(t);
      });
      if (score > 0) out.push({ id: d.id, score: score, by: 'bm25', why: 'terms:' + hits.join('|') });
    });
    out.sort(function (x, y) { return y.score - x.score; });
    return out;
  }

  /* =========================================================
     RRF 融合（Reciprocal Rank Fusion）

     为什么不用加权求和：BM25 分无界、L3 规则分是 10 分制，
     直接相加必须先归一化，而归一化系数会随候选集分布漂移
     （docs/03 §3.3.2）。RRF 只用排名，无此问题。

     ⚠️ RRF 分数只可用于排序，不可做绝对阈值：
        只召回一路时 top1 恒为 1/61，两路都第一恒为 2/61，
        与内容相关度无关（docs/03 §3.5.2）。
     ========================================================= */
  function rrfFuse(lists) {
    var agg = {};
    lists.forEach(function (list) {
      list.forEach(function (item, i) {
        var a = agg[item.id] || (agg[item.id] = { id: item.id, score: 0, by: [], ruleScore: 0, why: '' });
        a.score += 1 / (RRF_K + i + 1);
        if (a.by.indexOf(item.by) === -1) a.by.push(item.by);
        if (item.by === 'l3' && item.score > a.ruleScore) {
          a.ruleScore = item.score;
          a.why = item.why;
        }
      });
    });
    var out = Object.keys(agg).map(function (k) { return agg[k]; });
    out.sort(function (x, y) { return y.score - x.score; });
    out.forEach(function (a) {
      a.by = a.by.join('+');
      a.why = a.why || a.by;
    });
    return out;
  }

  /* =========================================================
     统一入口

     返回结构固定为 { entryId, score, layer, matchedBy, candidates }，
     三个引擎同一形状 —— 这是评测脚本能无差别换引擎的前提。
     ========================================================= */
  function retrieve(entries, text, opts) {
    var list = entries;
    if (!Array.isArray(list)) {
      list = Object.keys(entries || {}).map(function (k) { return entries[k]; });
    }
    var engine = (opts && opts.engine) || RETRIEVAL_ENGINE;
    var t = String(text || '').trim();
    var empty = { entryId: null, score: 0, layer: engine, matchedBy: '', candidates: [] };
    if (!t || !list.length) {
      lg('debug', '检索空输入', { engine: engine, entries: list.length });
      return empty;
    }

    var t0 = (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0;
    var candidates;
    if (engine === 'bm25') {
