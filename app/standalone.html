<script>
/* =========================================================
   应急助手 · 云服务接入（M2.6，2026-11-22）

   目标很窄，说清楚免得被误会成「整体上云」：
     **只把「日常解释扩写」这一条链从自建代理改成云端大模型**，
     意图判定（/act、/judge）、语音识别（/asr）、知识库全部不动。

   为什么只改这一条（依据是实测，不是偏好）：
     1. 今天中午线上 DeepSeek key 失效，/expand 全线 401。
        扩写挂在单个 key 上，是唯一的「一处失效就少一块功能」的地方。
        接云后 key 再失效，扩写仍可用。
     2. 意图判定绑着 100/100 与 97/100 的评测集，改它风险远大于收益；
        语音识别云服务 LLM 不支持音频入参，改不了。

   ★ 失败必须静默降级，且**不改变对外行为**
     调用方（app/llm.js expand）看到的结构与原来完全一致：
       { ok, text, latency_ms } 或 { ok:false, error }
     所以云端失败时它会自然回落自建代理 /expand —— 双层兜底。

   ★ 初始化参数来自 publicConfig，不许硬编码
     endpoint / publishableKey 是激活云服务时返回的公开配置。
     publishableKey 本身不带权限（服务端按 Origin 精确匹配），
     但仍不进日志。endpoint 绝不写死字面量 —— 重新发布后会变。
   ========================================================= */
(function (global) {
  'use strict';

  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('cloud');
    if (t && t[level]) t[level](msg, fields);
  }

  /* ---- publicConfig（激活云服务时返回，2026-11-22）----
     endpoint 与本应用域名一致，服务端 Origin 校验天然通过。 */
  var PUBLIC_CONFIG = {
    endpoint: 'https://anban-emergency-assistant.app.workbuddy.host',
    oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
    publishableKey: 'wbpk_Zf3ZNvIjyd2rPvyrnFPQ7L_lu0y22jmt9tHKUKnAGTtMYSiPqhHFoep',
    resourceId: 'wbcs_a1Sj8tBtOyWEZo79SlMreG',
  };

  var state = {
    ready: false,
    unavailableReason: null, // 客户端没起来的原因（界面可读）
    client: null,
    model: null, // 运行时从 models.list() 取，不硬编码
    modelsError: null,
    calls: 0,
    okCount: 0,
    failCount: 0,
    lastError: null,
  };

  /* 系统提示词：所有 chat.completions.create 都必须以 system 开头，
     否则 SDK 直接报错（文档明确：SDK 不会替你补）。
     内容只做「把条目整理成口语」，不新增任何事实 —— 与 S1「不许编」一致。 */
  var SYSTEM_PROMPT =
    '你是应急科普助手，为用户把给定的知识条目整理成一段口语化解释。' +
    '只能使用给定条目里的信息，不得新增任何事实、数字、药名或操作步骤。' +
    '不要写小标题、不要分点、不要寒暄，直接给一段连贯的话，控制在 120 字以内。';

  function ensureClient() {
    if (state.client) return state.client;
    var WBC = global.WorkBuddyCloud;
    if (!WBC || typeof WBC.createWorkBuddyCloud !== 'function') {
      state.unavailableReason = '云服务 SDK 未加载';
      lg('warn', '云服务不可用：SDK 未加载', { hasGlobal: !!WBC });
      return null;
    }
    try {
      state.client = WBC.createWorkBuddyCloud({
        endpoint: PUBLIC_CONFIG.endpoint,
        oauthRelayBaseUrl: PUBLIC_CONFIG.oauthRelayBaseUrl,
        publishableKey: PUBLIC_CONFIG.publishableKey,
      });
      state.ready = true;
      state.unavailableReason = null;
      lg('info', '云服务客户端已初始化', { endpoint: PUBLIC_CONFIG.endpoint });
      return state.client;
    } catch (e) {
      state.unavailableReason = String((e && e.message) || e);
      lg('warn', '云服务客户端初始化失败', { error: state.unavailableReason });
      return null;
    }
  }

  /* 模型列表：运行时拉取，空列表是合法结果，**不许回落到硬编码 id**。 */
  function pickModel() {
    if (state.model) return Promise.resolve(state.model);
    var c = ensureClient();
    if (!c) return Promise.resolve(null);
    return c.llm.models
      .list()
      .then(function (models) {
        var list = Array.isArray(models) ? models : [];
        if (!list.length) {
          state.modelsError = '模型列表为空';
          lg('warn', '云服务模型列表为空，扩写不可用');
          return null;
        }
        var pick = list.filter(function (m) {
          return m && m.disabled !== true;
        })[0];
        if (!pick) {
          state.modelsError = '模型全部被禁用';
          return null;
        }
        state.model = pick;
        lg('info', '云服务模型已选定', { id: pick.id, name: pick.name || null });
        return pick;
      })
      .catch(function (e) {
        state.modelsError = String((e && e.message) || e);
        lg('warn', '拉取模型列表失败', { error: state.modelsError });
        return null;
      });
  }

  /* 云端扩写。
     ⚠️ 云端 LLM 只支持流式（stream:true 必填，否则 request_stream_required）。
     对外仍给「一次性整段文本」，所以这里自己把 SSE 分片累积起来。 */
  function expand(question, scene) {
    var q = String(question || '').trim();
    var s = String(scene || '').trim();
    if (!q || !s) return Promise.resolve({ ok: false, error: 'empty-input' });
    var c = ensureClient();
    if (!c) return Promise.resolve({ ok: false, error: state.unavailableReason || 'no-client' });

    var t0 = Date.now();
    state.calls++;

    return pickModel()
      .then(function (model) {
        if (!model) return { ok: false, error: state.modelsError || 'no-model' };

        var entry = null;
        try {
          /* 条目来源是 window.KNOWLEDGE（tools/build_knowledge_js.py 生成的全局）。
             ⚠️ 不要写 APP.entries —— app.js 没有把 APP 挂到 window 上，
             实测取到 undefined，会误报 scene-not-found（本模块踩过一次）。 */
          var K = global.KNOWLEDGE;
          entry = (K && K.entries && K.entries[s]) || null;
        } catch (e) {
          entry = null;
        }
        if (!entry) {
          lg('warn', '云端扩写跳过：条目不存在', { scene: s });
          return { ok: false, error: 'scene-not-found' };
        }

        /* 只把条目自身字段交给模型 —— 不让用户原话直插，
           避免「用提问改写系统指令」那类注入（文档 Safety Notes）。 */
        var d = entry.daily || {};
        var material = [
          '条目名称：' + (entry.name || ''),
          '摘要：' + (d.summary || ''),
          '原因：' + (d.why || ''),
          '平时怎么做：' + (d.prevention || []).join('；'),
          '常见误区：' + (d.misconception || ''),
        ].join('\n');

        var messages = [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: '请把下面这条整理成一段口语解释：\n' + material },
        ];

        /* 云端只支持流式，返回 AsyncIterable<ChatCompletionChunk>
           （SDK 类型签名：create(): AsyncIterable<...>）。
           用 for await 逐片累积；只收 delta.content，
           reasoning_content 是思考过程，混进正文会污染屏幕与朗读。 */
        var text = '';
        var stream = c.llm.chat.completions.create({
          model: model.id,
          messages: messages,
          stream: true,
          temperature: 0.3,
        });

        return (async function () {
          for await (const chunk of stream) {
            var choice = chunk && chunk.choices && chunk.choices[0];
            var delta = choice && choice.delta;
            if (delta && typeof delta.content === 'string' && delta.content) {
              text += delta.content;
            }
          }
          var out = String(text || '').trim();
          var ms = Date.now() - t0;
          if (!out) {
            state.failCount++;
            state.lastError = 'empty-response';
            lg('warn', '云端扩写返回空文本', { scene: s });
            return { ok: false, error: 'empty-response' };
          }
          state.okCount++;
          lg('info', '云端扩写成功', { scene: s, chars: out.length, ms: ms });
          return { ok: true, text: out, latency_ms: ms, source: 'cloud' };
        })();
      })
      .catch(function (e) {
        state.failCount++;
        var code = (e && e.error && e.error.code) || '';
        state.lastError = code || String((e && e.message) || e);
        lg('warn', '云端扩写失败', { scene: s, code: state.lastError });
        return { ok: false, error: state.lastError };
      });
  }

  /* 健康信息：供 /health 与排查用，不含密钥 */
  function health() {
    return {
      ready: state.ready,
      reason: state.unavailableReason,
      model: state.model ? state.model.id : null,
      models_error: state.modelsError,
      calls: state.calls,
      ok: state.okCount,
      fail: state.failCount,
      last_error: state.lastError,
    };
  }

  global.CLOUD = {
    expand: expand,
    health: health,
    state: state,
    config: PUBLIC_CONFIG,
    pickModel: pickModel,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · LLM 意图判定客户端
   依据：docs/03 §2（判定层）、§5（三层兜底）

   为什么前端不直连 DeepSeek：
     key 写进 app/*.js，任何人 F12 就能拿到并盗用。这是硬约束不是取舍。
     所以前端只调本机代理（tools/llm_proxy.mjs），key 只在代理进程里。

   三个必须守住的行为（都有断言）：
     1. 代理不可用 → 静默回落 l3，不弹错误、不白屏（S1 的可用性前提）
     2. 超时 → 同上。默认 2500ms，宁可退字符检索也不让老人干等
     3. 返回的 scene 不在已发布集合内 → 不给步骤，只给拨号卡（S1 不许编）

   注意：本文件不含任何密钥，也不读 .env（浏览器读不到）。
   ========================================================= */
(function (global) {
  'use strict';

  /* 运行日志（M0 = app/log.js）。可选依赖：没加载就全部 no-op。 */
  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('llm');
    if (t[level]) t[level](msg, fields);
  }

  /* 端点由 log.js 的 resolveApiBase 决定（页面在 8787/https 时同源，
     本地 8899 分离模式回落 127.0.0.1:8787）。单独加载时兜底原地址。
     API_AUTH = 平台分享码（线上才有，本地为空），跟着每个请求走，不依赖 cookie。 */
  var API_AUTH = String(global.API_AUTH || '');
  var DEFAULT_ENDPOINT = String(global.API_BASE || 'http://127.0.0.1:8787') + '/judge' + API_AUTH;
  var DEFAULT_TIMEOUT = 2500;

  /* 置信度门槛（docs/03 §2.2「低于阈值不猜」+ §3.5）
     2026-11-18 实测标定，不是拍的：
       100 条评测集上 confidence 分布 min=0.55 / P05=0.75 / P50=0.95；
       两条判错样本里，O005「燃气灶打不着火」conf=0.55，P014「灭火器怎么选」conf=0.95。
       扫描 T=0.50→0.90：T=0.60 时 ④ 库外误纳率 96.7% → 100%（归零），
       综合准确率仅从 98.0% 降到 97.0%，代价是 2 条正确样本被降级。
     结论：0.60 是使安全项归零的最小阈值，取它。
     代价已知：P014 那类「高置信度判错」阈值救不了，只能靠改 prompt 或补样本。 */
  var MIN_CONFIDENCE = 0.60;

  var cfg = {
    endpoint: DEFAULT_ENDPOINT,
    timeout: DEFAULT_TIMEOUT,
    enabled: true,
    // 最近一次失败原因，供界面提示与排查（不展示给最终用户）
    lastError: null
  };

  /* ---------- 状态 ---------- */
  var stats = {
    calls: 0,
    ok: 0,
    failed: 0,
    timeouts: 0,
    fallbacks: 0
  };

  function configure(opts) {
    if (!opts) return cfg;
    if (opts.endpoint) cfg.endpoint = opts.endpoint;
    if (typeof opts.timeout === 'number') cfg.timeout = opts.timeout;
    if (typeof opts.enabled === 'boolean') cfg.enabled = opts.enabled;
    return cfg;
  }

  /* 带超时的 fetch。AbortController 是唯一可靠的中断方式：
     fetch 本身没有 timeout 参数，靠 Promise.race 只能「假装」超时，
     底层请求仍在跑，会继续占连接。 */
  function fetchWithTimeout(url, body, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) {
        return r.text().then(function (t) {
          throw new Error('代理返回 ' + r.status + ': ' + String(t).slice(0, 120));
        });
      }
      return r.json();
    }, function (e) {
      clearTimeout(timer);
      throw e;
    });
  }

  /**
   * 判定一句输入。
   * @returns {Promise<{ok:boolean, intent:string|null, scene:string|null,
   *                    confidence:number, source:'llm'|'fallback', error?:string}>}
   *
   * 永远 resolve，永不 reject —— 调用方不该为「模型挂了」写 try/catch。
   */
  function judge(text) {
    var t = String(text || '').trim();
    if (!cfg.enabled || !t) {
      lg('debug', '判定跳过', { reason: cfg.enabled ? 'empty-text' : 'disabled' });
      return Promise.resolve({ ok: false, intent: null, scene: null, confidence: 0, source: 'fallback', error: 'disabled' });
    }

    stats.calls++;
    var t0 = (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0;
    // trace 带进代理，这样代理侧那行日志能与前端对齐
    var trace = LOG ? LOG.getTrace() : null;
    return fetchWithTimeout(cfg.endpoint, { text: t, trace: trace }, cfg.timeout)
      .then(function (d) {
        if (!d || typeof d.intent !== 'string') {
          throw new Error('代理返回结构不合法');
        }
        stats.ok++;
        cfg.lastError = null;
        var v = {
          ok: true,
          intent: d.intent,
          turn: d.turn || null,
          evidence: d.evidence || '',
          scene: d.scene === undefined ? null : d.scene,
          sceneUnpublished: !!d.scene_unpublished,
          confidence: typeof d.confidence === 'number' ? d.confidence : 0,
          latency: d.latency_ms || 0,
          cached: !!d.cached,
          source: 'llm'
        };
        /* 摘要行 always：这是「为什么给/不给步骤」的源头，必须落盘。
           belowThreshold 单独算出来，省得看日志的人自己比 0.60。 */
        if (LOG && LOG.always) {
          LOG.always('llm', '判定完成', {
            intent: v.intent,
            scene: v.scene,
            confidence: v.confidence,
            belowThreshold: v.confidence < MIN_CONFIDENCE,
            sceneUnpublished: v.sceneUnpublished,
            cached: v.cached,
            modelMs: v.latency,
            ms: t0 ? (Date.now() - t0) : null
          });
        }
        return v;
      })
      .catch(function (e) {
        var isTimeout = e && (e.name === 'AbortError' || /abort/i.test(String(e.message)));
        if (isTimeout) stats.timeouts++; else stats.failed++;
        stats.fallbacks++;
        cfg.lastError = isTimeout ? 'timeout' : String((e && e.message) || e);
        /* 关键：这里不抛错。返回 fallback 让调用方走 l3。
           模型不可用是常态（断网、代理没起、key 过期），
           它不该表现为用户看到的一个错误弹窗。
           但**必须记 warn**：这是降级事件，不是正常路径。 */
        lg('warn', isTimeout ? '判定超时，回落 l3' : '判定失败，回落 l3', {
          timeoutMs: cfg.timeout,
          ms: t0 ? (Date.now() - t0) : null,
          error: cfg.lastError
        });
        return { ok: false, intent: null, scene: null, confidence: 0, source: 'fallback', error: cfg.lastError };
      });
  }

  /* 健康检查：界面可选用来决定是否显示「语义模式」标记 */
  /* =========================================================
     工具选择（/act）—— 2026-11-19 新增，docs/03 §2.5.12 D-12
     与 judge() 的分工：
       judge() 回答「这是什么意图」（标签），路由由前端代码定
       act()   回答「下一步调哪个工具」（动作），循环由 agent.js 执行

     为什么单独一个方法与端点：
       两者的输出契约、prompt、缓存键都不同；混在一起会让任一方改 prompt
       时污染另一方的评测基线（docs/03 §6 要求对照组稳定）。

     ⚠️ 本方法**不做合法性校验**（白名单、前置条件）。
        那归 app/tools.js 的 checkGate —— 门只能有一处实现，
        否则「测的」与「用的」会分叉（2026-11-18 评测脚本踩过）。
     ========================================================= */
  /* ⚠️ 必须在**运行时**从 cfg.endpoint 推导，不能在加载期算成常量。
     2026-11-19 踩过：写成 `var actEndpoint = DEFAULT_ENDPOINT.replace(...)`，
     结果 configure({endpoint}) 改了 judge 地址，act 仍打默认地址 ——
     e2e 的「代理不可用时回落」用例因此测不到 fallback（act 打的是真实代理）。
     将来 M3 把 endpoint 指向云端中继时，这个 bug 会让循环继续打本机旧地址。 */
  /* ⚠️ 端点现在可能带 query（线上 `?sharecode=...`），所以不能再用 `/\/judge$/`
     收尾锚定 —— 那样 replace 不生效，act 会打回 /judge，整个自主循环静默失效。
     用 lookahead 只换路径段，query 原样保留。 */
  function actUrl() {
    return String(cfg.endpoint || DEFAULT_ENDPOINT).replace(/\/judge(?=[?#]|$)/, '/act');
  }

  /* 会话上文只接受 {utterances: string[]}。
     这里**不裁剪条数与字数**：上限唯一实现在代理 normalizeContext，
     两处各裁一次会让「前端以为发了 5 条、代理实际收到 3 条」这类数字对不上。
     本函数只做一件事：结构不合法或为空 → 返回 null，请求体里连字段都不出现。 */
  function normalizeActContext(context) {
    if (!context || !Array.isArray(context.utterances)) return null;
    var list = context.utterances.filter(function (u) {
      return typeof u === 'string' && u.trim();
    });
    if (!list.length) return null;
    return { utterances: list };
  }

  /**
   * 让模型选下一步工具。
   * @param {string} text       当前这句话
   * @param {Array}  history    已执行过的工具调用（不含用户原话）
   * @param {{utterances:string[]}|null} context 更早说过的用户原话（不含当前句）
   */
  function act(text, history, context, policy) {
    var t = String(text || '').trim();
    if (!cfg.enabled || !t) {
      return Promise.resolve({ ok: false, error: 'disabled' });
    }
    stats.calls++;
    var trace = LOG ? LOG.getTrace() : null;
    var ctx = normalizeActContext(context);
    var payload = { text: t, history: history || [], trace: trace };
    /* ⚠️ 空上文时**字段必须完全省略**：A 模式（无记忆）与 100 条单轮基线
       要在加记忆前后逐字一致，否则历史数字不能再拿来对照。 */
    if (ctx) payload.context = ctx;
    /* 回合策略：只传类型与 allowSteps，不把整段策略逻辑塞进请求体。 */
    if (policy && policy.type) {
      payload.turn = policy.type;
      payload.allow_steps = policy.allowSteps !== false;
    }
    return fetchWithTimeout(actUrl(), payload, cfg.timeout)
      .then(function (d) {
        if (!d || typeof d.act !== 'string') {
          throw new Error('代理 /act 返回结构不合法');
        }
        cfg.lastError = null;
        if (LOG && LOG.always) {
          LOG.always('llm', 'act 决策', {
            act: d.act,
            turn: d.turn || null,
            evidence: d.evidence || null,
            args: d.args || null,
            reason: d.reason || null,
            /* note 落 always：它是**会显示给用户**的文字。
               凡是用户能看到的文本，必须留痕，否则事后无法复现「他当时看到了什么」。 */
            note: d.note || null,
            /* 上文条数落日志：排查「第二句为什么判错」时，先看这里是不是 0。
               0 = 没带上下文或结构不合法，不一定是模型问题。 */
            ctxLen: ctx ? ctx.utterances.length : 0,
            latency: d.latency_ms || 0,
            cached: !!d.cached
          });
        }
        return {
          ok: true,
          turn: d.turn || null,
          evidence: d.evidence || '',
          act: d.act,
          args: d.args || {},
          reason: d.reason || '',
          note: d.note || '',
          latency: d.latency_ms || 0,
          cached: !!d.cached
        };
      })
      .catch(function (e) {
        var isTimeout = e && (e.name === 'AbortError' || /abort/i.test(String(e.message)));
        if (isTimeout) stats.timeouts++;
        else stats.failed++;
        stats.fallbacks++;
        cfg.lastError = isTimeout ? 'timeout' : String((e && e.message) || e);
        lg('info', 'act 不可用，调用方应回落单次判定', { error: cfg.lastError });
        // 与 judge 同一立场：永不 reject，让调用方决定怎么降级
        return { ok: false, error: cfg.lastError };
      });
  }

  /* P5 日常解释扩写（2026-11-20）。
     与 judge/act 同一个代理、同一个 endpoint，只是走 /expand。
     超时给 6s：代理侧可能重试一次（两次模型往返），但它是「静态卡已出现后的增强」，
     不阻塞首卡；失败就保持静态。 */
  function expandUrl() {
    return String(cfg.endpoint || DEFAULT_ENDPOINT).replace(/\/judge(?=[?#]|$)/, '/expand');
  }

  /* 代理通道（原有实现，原样保留）。
     云端失败时回落到这里，所以本函数的行为一个字都不改。 */
  function expandViaProxy(q, s, trace) {
    return fetchWithTimeout(expandUrl(), { question: q, scene: s, trace: trace }, 6000)
      .then(function (d) {
        if (!d || typeof d.ok !== 'boolean') throw new Error('代理 /expand 返回结构不合法');
        if (LOG && LOG.always) {
          LOG.always('llm', 'expand 结果', {
            ok: !!d.ok,
            reason: d.reason || null,
            chars: d.text ? String(d.text).length : 0,
            latency: d.latency_ms || 0
          });
        }
        return d;
      })
      .catch(function (e) {
        var msg = String((e && e.message) || e);
        lg('warn', 'expand 失败，保持静态卡', { error: msg });
        return { ok: false, error: msg };
      });
  }

  /* 云端扩写开关（2026-11-22 用户指令：先上线「读写一致」那版）。

     ⚠️ 为什么默认 false —— 这是实测出来的冲突，不是保守：
       云端扩写实测 2991 / 3511 / 3609 ms（三个场景），而 app.js 的朗读窗口
       EXPAND_WAIT_MS = 600ms（当初按代理约 1s 定的）。
       扩写永远赶不上窗口 → 每次都走超时分支 → 扩写形同失效。
       若把窗口抬到 4s，首句出声最坏约 7s（V6 预算 3s），急救场景不可接受。

     所以现在：**扩写回到只走代理**，行为与接云之前完全一致，
     「读什么=看什么」的修复照常生效。云端代码保留但不参与运行，
     下一步怎么取舍（首轮代理/后续追问走云）等用户定。

     改回云端只需把下面常量置 true —— 前提是先解决 3.5s vs 600ms 的窗口问题。 */
  var CLOUD_EXPAND_ENABLED = false;

  function expand(question, scene) {
    var q = String(question || '').trim();
    var s = String(scene || '').trim();
    if (!cfg.enabled || !q || !s) return Promise.resolve({ ok: false, error: 'disabled' });
    var trace = LOG ? LOG.getTrace() : null;

    var CLOUD = CLOUD_EXPAND_ENABLED ? global.CLOUD : null;
    if (!CLOUD || typeof CLOUD.expand !== 'function') {
      lg('debug', '扩写走代理（云端扩写未启用）');
      return expandViaProxy(q, s, trace);
    }

    return CLOUD.expand(q, s).then(function (r) {
      if (r && r.ok && r.text) {
        if (LOG && LOG.always) {
          LOG.always('llm', 'expand 结果（云端）', {
            ok: true,
            chars: String(r.text).length,
            latency: r.latency_ms || 0,
            source: 'cloud'
          });
        }
        return r;
      }
      /* 云端没给内容 → 回落代理。**不把失败包装成成功**，
         也不静默返回空串：让调用方拿到真实的 ok:false 或代理的真实结果。 */
      lg('warn', '云端扩写不可用，回落代理', { error: (r && (r.error || r.reason)) || 'unknown' });
      return expandViaProxy(q, s, trace).then(function (p) {
        if (p && p.ok && p.text && LOG && LOG.always) {
          LOG.always('llm', 'expand 结果（代理兜底）', {
            ok: true,
            chars: String(p.text).length,
            latency: p.latency_ms || 0,
            source: 'proxy'
          });
        }
        return p;
      });
    });
  }

  function health() {
    return fetch(cfg.endpoint.replace(/\/judge$/, '/health'), { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  /**
   * 把 LLM 判定映射成路由决策。
   *
   * 这是整个接入里最需要小心的一步：LLM 只给标签，路由由代码定
   * （docs/03 §2 A1「判定层只输出标签，不输出文字」）。
   *
   * @param verdict judge() 的返回值
   * @param entries 已发布条目表
   * @param dangerRules 危险信号判定函数（l3 的，作为安全兜底）
   */
  function routeByVerdict(verdict, entries, detectDanger, text) {
    var decision = decideRoute(verdict, entries, detectDanger, text);
    /* 路由结论必须落盘（always）：`reason` 字段是「为什么给这张卡」
       的唯一解释，包括 danger-override / low-confidence 这些分支。
       2026-11-18「电梯广告怎么投诉」误给步骤卡，就是靠这个字段定位的。 */
    if (LOG && LOG.always) {
      LOG.always('llm', decision ? '路由结论' : '路由未参与', {
        action: decision ? decision.action : null,
        entryId: decision ? decision.entryId : null,
        sceneId: decision ? decision.sceneId : null,
        reason: decision ? decision.reason : 'llm-unavailable'
      });
    }
    return decision;
  }

  function decideRoute(verdict, entries, detectDanger, text) {
    // 兜底：LLM 不可用 → 完全走原 l3 逻辑，行为与接入前一致
    if (!verdict || !verdict.ok) {
      lg('debug', '路由未参与（LLM 无结论），交回 l3');
      return null;
    }

    /* 置信度门槛：低于阈值一律不猜（docs/03 §2.2）。
       为什么不「低置信度时给拨号卡」：给号码也要先判对场景，判不对时
       给的是错场景的号码（「燃气灶打不着火」会拿到 119）。
       拒答卡本身带 tel:120 拨号按钮（S4），图标区也仍在，
       所以「拒答」不等于「用户无路可走」。 */
    if (typeof verdict.confidence === 'number' && verdict.confidence < MIN_CONFIDENCE) {
      lg('info', '置信度低于门槛，降级为拒答', {
        confidence: verdict.confidence, threshold: MIN_CONFIDENCE,
        intent: verdict.intent, scene: verdict.scene
      });
      return {
        action: 'refuse',
        entryId: null,
        reason: 'low-confidence',
        confidence: verdict.confidence
      };
    }

    var scene = verdict.scene;
    var hasEntry = !!(scene && entries && entries[scene]);

    /* CPR/溺水范围闸（docs/14 C11/C12，2026-11-21）：
       judge 回落路径没有 agent 的范围闸，必须在这里补，否则「小孩溺水」会拿成人步骤。
       · 儿科 → dialonly（本库无儿科 CPR 参数）
       · 溺水（非儿科）→ drowning 条目；不套成人 cpr */
    var scope =
      text && global.RETRIEVAL && global.RETRIEVAL.isCprOutOfScope
        ? global.RETRIEVAL.isCprOutOfScope(text)
        : null;
    var severeHit =
      text && global.RETRIEVAL && global.RETRIEVAL.detectSevere
        ? global.RETRIEVAL.detectSevere(text) || ''
        : '';
    var isBleeding = /大出血|流血不止|止不住血/.test(severeHit);
    /* 只对 CPR/溺水语境生效：孩子烫伤、孩子跌倒不能因为「孩子」二字被拨号。 */
    var cprContext = !isBleeding && (scene === 'cpr' || scene === 'drowning' || !!severeHit);
    if (verdict.intent === 'ongoing' && scope && cprContext) {
      if (scope === 'pediatric') {
        return {
          action: 'dialonly',
          entryId: null,
          sceneId: scene || 'cpr',
          reason: 'cpr-out-of-scope:pediatric'
        };
      }
      if (scope === 'drowning') {
        if (entries && entries.drowning) {
          return { action: 'steps', entryId: 'drowning', reason: 'drowning-entry' };
        }
        return {
          action: 'dialonly',
          entryId: null,
          sceneId: 'drowning',
          reason: 'cpr-out-of-scope:drowning'
        };
      }
    }

    /* 关键词兜底：**只在 LLM 认为是紧急、但归不出场景时**启用。
     *
     * ⚠️ 2026-11-18 修 bug：上一版的条件是「只要关键词命中且该场景有条目」就给步骤，
     *    结果「电梯广告怎么投诉」（LLM 正确判 off_scope → scene=null）因为含「电梯」
     *    被兜底成 elevator_trapped 的步骤卡 —— 用户问投诉，收到急救步骤。
     *    这正是 L3 那个 40% 误纳率，被原样搬到了 LLM 路径上，
     *    把 LLM 判对的结论又盖掉了。
     *
     * 收紧后的规则：
     *   - ongoing + 有场景   → 正常走 llm-ongoing（不需要兜底）
     *   - ongoing + 无场景   → 用关键词兜底（LLM 认为是紧急，只是说不出是哪个场景）
     *   - prevention        → 尊重 LLM，**不**兜底（「怎么预防煤气泄漏」不该给步骤卡）
     *   - off_scope         → 尊重 LLM，**不**兜底（关键词命中不等于正在出事）
     *
     * 代价：LLM 若把「煤气漏了」误判成 off_scope，兜底不再救它。
     * 但实测 LLM 在 ongoing 类上 40/40，这个代价可接受；
     * 反过来「误给急救步骤」的代价不可接受——它违背 S1（不许编/不许答不该答的）。
     */
    var danger = (verdict.intent === 'ongoing' && !hasEntry && detectDanger)
      ? detectDanger(text) : null;
    if (danger && entries && entries[danger.id]) {
      return { action: 'steps', entryId: danger.id, reason: 'danger-override' };
    }

    if (verdict.intent === 'ongoing') {
      if (hasEntry) return { action: 'steps', entryId: scene, reason: 'llm-ongoing' };
      if (scene) return { action: 'dialonly', entryId: null, sceneId: scene, reason: 'llm-ongoing-unpublished' };
      return { action: 'refuse', entryId: null, reason: 'llm-ongoing-noscene' };
    }

    if (verdict.intent === 'prevention') {
      if (hasEntry) return { action: 'daily', entryId: scene, reason: 'llm-prevention' };
      return { action: 'refuse', entryId: null, reason: 'llm-prevention-noscene' };
    }

    // off_scope 以及任何未知 intent
    return { action: 'refuse', entryId: null, reason: 'llm-off-scope' };
  }

  global.LLM = {
    judge: judge,
    act: act,
    expand: expand,
    health: health,
    configure: configure,
    config: cfg,
    stats: stats,
    routeByVerdict: routeByVerdict,
    DEFAULT_ENDPOINT: DEFAULT_ENDPOINT
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · 语音输出（TTS）
   依据：docs/01 §2.1「语音播报是主输出通道，文字只是备份（M2 起生效）」
        docs/01 §6.2「不允许静默失败」——不可用必须明确告知

   M2 的定位（01 §158）：TTS 朗读属于 M2；但**离线原生 TTS 仍属 M3**。
   所以本文件按「三层实现，自动选最好的一层」设计：

     ① tauri  —— Tauri 打包后走 tauri-plugin-tts（Windows SAPI / Android 原生
                 TextToSpeech）。需要 npm install tauri-plugin-tts-api 且在 Tauri 内运行。
     ② web    —— 桌面浏览器的 window.speechSynthesis。
                 实测（2026-11-18，小米 Android 16）：Android 手机浏览器
                 **没有 speechSynthesis**（docs/03 §2.4 事实 4）。所以 web 层只对
                 桌面可靠；Android 的语音输出只剩 ① tauri 插件一条路（M3 打包后验），
                 Android 浏览器上自动落到 ③ none（文字 + 明确提示）。
     ③ none   —— 都没有。此时 mustNotFailSilently()：界面必须显示提示，不能装作说了。

   三条设计约束：
     A. 朗读文本只能来自条目字段（S1：不许编）。本文件不做任何改写、不总结、不加词。
     B. 语音开关状态要持久化（localStorage），老人不用每次重新打开。
     C. 语速默认 0.9 —— 老人听不清快语速。可调但默认偏慢。
   ========================================================= */
(function (global) {
  'use strict';

  /* 运行日志（M0 = app/log.js）。可选依赖：没加载就全部 no-op。
     ⚠️ 语音层的日志不是「锦上添花」：朗读失败是**静默**的（自动读失败不提示），
        所以「没听见」无法从界面区分「没触发」和「被浏览器拦了」。
        只有日志能回答。这也是 2026-11-18 那次 bug 的教训。 */
  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('voice');
    if (t[level]) t[level](msg, fields);
  }

  var STORAGE_KEY = 'emergency-tts-pref';

  /* ---------- 状态 ---------- */
  var state = {
    engine: 'none',       // 'tauri' | 'web' | 'none'
    supported: false,
    enabled: true,        // 用户是否想听（持久化）
    speaking: false,
    rate: 0.9,            // 默认偏慢，老人友好
    lang: 'zh-CN',
    voiceName: null,      // 实际选中的音色名，供诊断显示
    lastError: null,
    // 不可用原因（给界面提示用，必须是用户能看懂的话）
    unavailableReason: null
  };

  var stats = { speaks: 0, completes: 0, errors: 0, cancelled: 0 };

  function loadPref() {
    try {
      var raw = global.localStorage && global.localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      if (typeof p.enabled === 'boolean') state.enabled = p.enabled;
      /* 2026-11-21 语速功能取消：旧版本可能存过 rate，读到时顺手清掉。 */
      if (p && Object.prototype.hasOwnProperty.call(p, 'rate')) {
        try {
          global.localStorage.setItem(STORAGE_KEY, JSON.stringify({ enabled: state.enabled }));
        } catch (e2) { /* 忽略 */ }
      }
    } catch (e) { /* localStorage 不可用就忽略，不影响功能 */ }
  }

  function savePref() {
    try {
      if (global.localStorage) {
        global.localStorage.setItem(STORAGE_KEY, JSON.stringify({
          enabled: state.enabled
        }));
      }
    } catch (e) { /* 同上 */ }
  }

  /* ---------- 引擎探测 ---------- */

  /* Tauri 环境判定：Tauri 2 会注入 __TAURI_INTERNALS__。
     注意不要用 window.__TAURI__（那是 withGlobalTauri 才有的可选注入）。 */
  function isTauri() {
    return !!(global.__TAURI_INTERNALS__ || global.__TAURI__);
  }

  /* ---------- 引擎注册表（2026-11-19 provider 化，docs/11 选项 A） ----------

     改之前的样子：`detect()` 里一个 `if (isTauri())`，`speak()` 一个三元表达式，
     `stop()` 一个 if/else —— 引擎判定散在三处，加第三个引擎（云 TTS）要同时改三个地方。

     现在：**探测顺序、朗读、停止都由下面两张表驱动**。
     加新引擎 = 在 PROBES 与 ENGINES 各加一行 + 写它的 probe/speak/stop，不改这三个函数。

     两条刻意保留的约束（不要「优化」掉）：
       ① **顺序必须是 tauri → web → none**。`01` §2.1 定的：原生引擎音质与稳定性最好。
       ② **不跨文件拆目录**。M3 打包时 frontendDist 就是 app/，file:// 直开不能有构建步骤，
          拆目录只会增加路径管理的失败面。所以注册表就放在本文件里。 */

  /* 探测链：按顺序试，第一个成功的就是当前引擎 */
  var PROBES = [
    { id: 'tauri', label: 'Tauri 原生 TTS', probe: probeTauri },
    { id: 'web', label: '浏览器 speechSynthesis', probe: probeWeb }
  ];

  /* 朗读与停止的实现表。key 与 PROBES 的 id 必须一致。 */
  var ENGINES = {
    tauri: { id: 'tauri', label: 'Tauri 原生 TTS', speak: speakTauri, stop: stopTauri },
    web: { id: 'web', label: '浏览器 speechSynthesis', speak: speakWeb, stop: stopWeb }
  };

  function activeEngine() {
    return ENGINES[state.engine] || null;
  }

  /* 探测可用引擎。异步，因为 Tauri 插件需要动态 import。 */
  function detect() {
    var i = 0;

    function tryNext() {
      if (i >= PROBES.length) return Promise.resolve(detectNone());
      var p = PROBES[i++];
      return Promise.resolve()
        .then(function () { return p.probe(); })
        .then(function (ok) {
          if (!ok) {
            lg('info', p.label + ' 不可用，试下一个');
            return tryNext();
          }
          return activate(p.id);
        })
        .catch(function (e) {
          lg('warn', p.label + ' 探测异常，试下一个', { error: String((e && e.message) || e) });
          return tryNext();
        });
    }

    return tryNext();
  }

  /* 把某个引擎设为当前引擎，并做它需要的初始化 */
  function activate(id) {
    if (id === 'web') return activateWeb();
    state.engine = id;
    state.supported = true;
    state.unavailableReason = null;
    if (LOG && LOG.always) LOG.always('voice', '探测成功：' + id, { engine: id });
    return state;
  }

  /* 全都不行：这条分支以前藏在 detectWeb 里，现在单独一个函数，
     因为「没有引擎」和「浏览器不支持」是两件事，日志要能区分。 */
  function detectNone() {
    state.engine = 'none';
    state.supported = false;
    state.unavailableReason = state.unavailableReason || '这台设备的浏览器不支持语音朗读';
    return state;
  }

  /* 浏览器层探测：只回答「环境有没有这个 API」，不做副作用。
     失败时**强制落盘**——这是「设备没声音」的根因，必看（`01` §6.2 不许静默失败）。 */
  function probeWeb() {
    var ss = global.speechSynthesis;
    var hasUtt = typeof global.SpeechSynthesisUtterance === 'function';
    if (!ss || !hasUtt) {
      if (LOG && LOG.always) {
        LOG.always('voice', '探测失败：环境无 speechSynthesis', {
          hasSynth: !!ss, hasUtterance: hasUtt, tauri: isTauri()
        });
      }
      return false;
    }
    return true;
  }

  /* Tauri 层探测：不在 Tauri 环境里直接 false，不打日志（否则普通浏览器会刷一条无意义的 info） */
  function probeTauri() {
    if (!isTauri()) return Promise.resolve(false);
    return detectTauriPlugin();
  }

  function detectTauriPlugin() {
    /* 插件是可选依赖：没装 npm 包就视为不可用，不报错。
       用 import() 而不是静态 import，避免打包时强制要求它存在。 */
    if (typeof global.__TTsProbe === 'function') return Promise.resolve(global.__TTsProbe());
    return Promise.resolve(false);
  }

  /* 激活浏览器层：设状态 + 挑音色 + 监听音色异步填充 */
  function activateWeb() {
    var ss = global.speechSynthesis;
    state.engine = 'web';
    state.supported = true;
    state.unavailableReason = null;
    // 音色列表可能异步填充（Chrome 首次为空）
    pickVoice();
    if (ss && ss.addEventListener) ss.addEventListener('voiceschanged', pickVoice);
    return state;
  }

  function pickVoice() {
    var ss = global.speechSynthesis;
    if (!ss || !ss.getVoices) return;
    var voices = ss.getVoices() || [];
    if (!voices.length) return;
    var zh = voices.filter(function (v) {
      return /^zh(-|_)?/i.test(v.lang || '') || /Chinese|中文|普通话/i.test(v.name || '');
    });
    // 优先女声（01 §4.3 对 Windows 的要求是默认 Huihui，这里取同类偏好）
    var preferFemale = zh.filter(function (v) {
      return /female|huihui|yaoyao|xiaoxiao|女/i.test(v.name || '');
    });
    var chosen = preferFemale[0] || zh[0] || null;
    /* 关键：没有中文音色 = 说出来是英文腔或乱读。
       这不报错，但等于「不可用」，必须让界面知道（06 §6.2 不许静默失败）。 */
    if (!chosen) {
      state.supported = false;
      state.unavailableReason = '这台设备没有装中文语音包，朗读会读成外文';
      if (LOG && LOG.always) {
        LOG.always('voice', '探测失败：无中文音色', {
          voiceCount: voices.length,
          langs: voices.slice(0, 5).map(function (v) { return v.lang; })
        });
      }
      return;
    }
    state.voiceName = chosen.name;
    state.unavailableReason = null;
    if (LOG && LOG.always) {
      LOG.always('voice', '探测成功', {
        engine: state.engine, voice: chosen.name, lang: chosen.lang, rate: state.rate
      });
    }
  }

  /* ---------- 朗读 ---------- */

  /* S5 要求的固定安全句（2026-11-19 修复 K1）。
     `01` §8 S5 原文：「生命危险场景：给关键步骤 + **播报含「同时拨打 120」** + 显式拨号按钮，
     判据：命中 life_threatening: true 的条目，播报文本须含该句，**缺一即失败**」。

     修复前实测：6 条 life_threatening 条目里 **0/6** 的朗读稿含任何「拨打」字样——
     因为朗读稿只拼条目字段（S1 不许改写），而 9 条知识库没有任何一条的 steps 写了「拨打」。
     后果：只听不看的老人，播报里不知道要同时打电话。这是安全问题，不是文案问题。

     号码取条目的 emergency_number，**不是硬写 120**：
       燃气/火灾/地震的正确号码是 119，中毒/触电/气道梗阻是 120。
       统一念 120 会让消防场景拨错号。用户 2026-11-19 裁决取本条号码。

     为什么加在播报层而不是改知识库：
       这是「怎么说」不是「说什么」——念一句「同时拨打 119」不新增任何操作指导，
       不违反 S1。改知识库则要重过源文逐字比对，且源站未必写了这句。 */
  function composeEmergencyCallSentence(entry) {
    if (!entry || !entry.life_threatening) return '';
    var num = String(entry.emergency_number || '').trim();
    if (!num) return '';
    return '同时拨打' + num + '。';
  }

  /* 把步骤卡拼成朗读稿。**只做拼接，不改写任何文字**（S1）。
     2026-11-21 用户裁决「内容全读，批注不要读」：
       - 不再念「立刻做 / 接着做 / 绝对不要做」这些段落标题（它们是界面批注）；
       - 三段的所有步骤文字全部念；
       - 生命危险条目末尾仍加「同时拨打 N」（S5 安全句，不是批注）。 */
  function composeStepsScript(entry, immediateOverride) {
    if (!entry || !entry.steps) return '';
    var parts = [];
    if (entry.name) parts.push(entry.name + '。');

    var segs = [
      { key: 'immediate', data: immediateOverride || entry.steps.immediate },
      { key: 'next', data: entry.steps.next },
      { key: 'never', data: entry.steps.never }
    ];

    segs.forEach(function (seg) {
      var arr = seg.data || [];
      arr.forEach(function (s) {
        var t = String((s && s.text) || '').trim();
        if (!t) return;
        parts.push(t + '。');
      });
    });

    /* S5：放在最后。
       为什么不在开头：老人最先要听的是「立刻做什么」，先念号码会把最急的动作往后推。 */
    var call = composeEmergencyCallSentence(entry);
    if (call) parts.push(call);

    return parts.join('');
  }

  /* 日常卡朗读稿。
     leadOverride：**屏幕实际显示的那段解释**（2026-11-22 加）。
     为什么需要它：日常卡的「解释」有两代来源 —— 条目里的 daily.summary，
     和模型扩写（/expand）返回的文本。屏幕可能显示的是后者。
     若朗读仍从条目取 summary，就会出现「读的和看的不一样」：
       屏幕：模型扩写的口语化文本
       声音：条目原文
     这不是偶发竞争，是必然——两处各取一个源。
     所以把「屏幕上那段」的字符串直接传进来，让声音和屏幕同源。
     不传（undefined）时行为与改造前完全一致，向后兼容。 */
  function composeDailyScript(entry, leadOverride) {
    if (!entry || !entry.daily) return '';
    var d = entry.daily;
    var parts = [];
    if (entry.name) parts.push(entry.name + '。');
    /* 有 override 就用它替代 summary。前置校验空串：空串不等于「没给」，
       若把空串当有效值会读出一段缺失了解释的稿子。 */
    var lead =
      typeof leadOverride === 'string' && leadOverride.trim() ? leadOverride : d.summary;
    if (lead) parts.push(lead);
    if (d.why) parts.push(d.why);
    (d.prevention || []).forEach(function (p) {
      if (p) parts.push(String(p) + '。');
    });
    if (d.misconception) parts.push(d.misconception);
    return parts.join('');
  }

  /* 日常也读全文（2026-11-21 用户裁决「内容全读」）。
     不再区分「只读名称+摘要」；保留函数名，避免改调用方。 */
  function composeDailyBriefScript(entry, leadOverride) {
    return composeDailyScript(entry, leadOverride);
  }

  /* 分诊卡阶段还没有步骤，只能把问题和选项念出来。
     为什么必须念选项：老人看不清屏幕时，「你现在在哪儿」之后如果听不到
     「在室内 / 在室外 / 被埋或被困」，就无从选择，等于卡死在这里。 */
  function composeTriageScript(entry) {
    if (!entry || !entry.triage) return '';
    var parts = [];
    if (entry.name) parts.push(entry.name + '。');
    if (entry.triage.question) parts.push(entry.triage.question);
    (entry.triage.options || []).forEach(function (o, i) {
      var label = String((o && o.label) || '').trim();
      if (label) parts.push('第' + (i + 1) + '个，' + label + '。');
    });
    /* S5 同样适用：分诊卡是 gas_leak / earthquake / fall_elderly 的**首屏**，
       此时老人还没听到任何步骤，更需要在最后听到「同时拨打 N」。
       位置放在选项之后：先听清「你在哪儿」（选项），再听「要打电话」——
       顺序反了会让人以为不用回答分诊问题、直接打电话。 */
    var call = composeEmergencyCallSentence(entry);
    if (call) parts.push(call);
    return parts.join('');
  }

  /* 主入口：读一段文本 */
  function speak(text, opts) {
    var o = opts || {};
    var t = String(text || '').trim();
    if (!t) {
      lg('debug', '朗读跳过：空文本');
      return Promise.resolve({ ok: false, reason: 'empty' });
    }
    if (!state.supported) {
      lg('warn', '朗读未执行：设备不支持', { reason: state.unavailableReason });
      return Promise.resolve({ ok: false, reason: 'unsupported', message: state.unavailableReason });
    }
    if (!state.enabled && !o.force) {
      lg('info', '朗读跳过：用户关掉了语音开关');
      return Promise.resolve({ ok: false, reason: 'disabled' });
    }

    stats.speaks++;
    var t0 = (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0;
    /* 摘要行 always：记「念了什么」的开头 20 字 + 长度。
       为什么不全记：朗读稿最长 300+ 字，全文堆积没有排查价值；
       但开头 20 字足够判断「读的是哪张卡的哪一段」。 */
    if (LOG && LOG.always) {
      LOG.always('voice', '开始朗读', {
        engine: state.engine,
        chars: t.length,
        head: t.slice(0, 20),
        force: !!o.force,
        rate: o.rate || state.rate
      });
    }
    /* 查表分发。以前是 `engine === 'tauri' ? speakTauri : speakWeb` 的三元表达式，
       加第三个引擎就要改这一行；现在只在 ENGINES 里加一行。 */
    var eng = activeEngine();
    var p = eng
      ? eng.speak(t, o)
      : Promise.resolve({ ok: false, reason: 'no-engine', message: state.unavailableReason });
    return p.then(function (r) {
      var ms = t0 ? (Date.now() - t0) : null;
      if (r && r.ok) {
        lg('debug', '朗读完成', { ms: ms, engine: r.engine });
      } else if (r && r.reason === 'cancelled') {
        lg('debug', '朗读被取消', { ms: ms });
      } else {
        // 真失败：必须 warn 落盘（自动读时界面上不提示，只有这里有痕迹）
        lg('warn', '朗读失败', { ms: ms, reason: (r && r.reason) || 'unknown', message: (r && r.message) || null });
      }
      return r;
    });
  }

  function speakTauri(text, o) {
    /* 真实实现由宿主通过 setTauriAdapter(speakFn, stopFn) 注入到 global.__TTsSpeak。
       本函数只做「有就用、没有就报告」的包装，不假装成功。

       ⚠️ 2026-11-19 修正：原文写「见 index.html 末尾的适配片段」——那个片段不存在
       （`grep -n "__TTs\|tauri" app/index.html` 零匹配）。注释指向不存在的代码，
       下一个人会白找一遍。真实注入点只有 setTauriAdapter，M3 打包时由宿主调用。 */
    var fn = global.__TTsSpeak;
    if (typeof fn !== 'function') {
      stats.errors++;
      state.lastError = 'tauri-tts-adapter-missing';
      return Promise.resolve({ ok: false, reason: 'adapter-missing' });
    }
    state.speaking = true;
    return Promise.resolve(fn(text, { rate: o.rate || state.rate, lang: o.lang || state.lang }))
      .then(function () { state.speaking = false; stats.completes++; return { ok: true, engine: 'tauri' }; })
      .catch(function (e) {
        state.speaking = false; stats.errors++;
        state.lastError = String((e && e.message) || e);
        return { ok: false, reason: 'error', message: state.lastError };
      });
  }

  function speakWeb(text, o) {
    var ss = global.speechSynthesis;
    var U = global.SpeechSynthesisUtterance;
    return new Promise(function (resolve) {
      try { ss.cancel(); } catch (e) { /* 某些实现 cancel 会抛，忽略 */ }

      var u = new U(text);
      u.lang = o.lang || state.lang;
      u.rate = o.rate || state.rate;
      u.pitch = 1;
      u.volume = 1;
      if (state.voiceName && ss.getVoices) {
        var voices = ss.getVoices() || [];
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].name === state.voiceName) { u.voice = voices[i]; break; }
        }
      }

      var settled = false;
      function done(r) { if (!settled) { settled = true; state.speaking = false; resolve(r); } }

      u.onend = function () { stats.completes++; done({ ok: true, engine: 'web' }); };
      u.onerror = function (ev) {
        // 'interrupted' / 'canceled' 是主动取消，不算错误
        var err = (ev && ev.error) || 'unknown';
        if (err === 'interrupted' || err === 'canceled') { stats.cancelled++; done({ ok: false, reason: 'cancelled' }); return; }
        stats.errors++;
        state.lastError = err;
        done({ ok: false, reason: 'error', message: err });
      };

      state.speaking = true;
      try {
        ss.speak(u);
      } catch (e) {
        state.speaking = false; stats.errors++;
        state.lastError = String((e && e.message) || e);
        done({ ok: false, reason: 'throw', message: state.lastError });
      }
    });
  }

  function stop() {
    var eng = activeEngine();
    try {
      if (eng && eng.stop) {
        eng.stop();
      } else if (global.speechSynthesis) {
        /* 兜底：没有当前引擎时（engine='none'）也可能有一个残留的合成器，
           取消一次不会有害——比「按了停止却还在念」好。 */
        global.speechSynthesis.cancel();
      }
    } catch (e) { /* 忽略 */ }
    state.speaking = false;
    stats.cancelled++;
    lg('info', '用户停止朗读');
  }

  /* 两个引擎各自的停止实现（以前它们内联在 stop() 里） */
  function stopTauri() {
    if (typeof global.__TTsStop === 'function') global.__TTsStop();
  }

  function stopWeb() {
    if (global.speechSynthesis) global.speechSynthesis.cancel();
  }

  function setEnabled(v) {
    state.enabled = !!v;
    savePref();
    if (!state.enabled) stop();
    lg('info', '语音开关变更', { enabled: state.enabled });
  }

  /* 语速功能已取消（2026-11-21 用户裁决）：固定默认 0.9，不再暴露 setRate。 */

  loadPref();

  global.TTS = {
    detect: detect,
    speak: speak,
    stop: stop,
    setEnabled: setEnabled,
    composeStepsScript: composeStepsScript,
    composeDailyScript: composeDailyScript,
    composeDailyBriefScript: composeDailyBriefScript,
    composeTriageScript: composeTriageScript,
    composeEmergencyCallSentence: composeEmergencyCallSentence,
    state: state,
    stats: stats,
    /* 宿主注入原生 TTS 实现的唯一入口（M3 由打包层调用）。
       接口表，供断言与排查用 —— 改引擎不该只能靠读源码。 */
    engines: function () {
      return PROBES.map(function (p) { return p.id; });
    },
    activeEngine: function () { return state.engine; },
    setTauriAdapter: function (speakFn, stopFn) {
      if (typeof speakFn !== 'function') return;
      global.__TTsSpeak = speakFn;
      if (typeof stopFn === 'function') global.__TTsStop = stopFn;

      /* ⚠️ 2026-11-19 修的真 bug（docs/11 §2.3 缺陷 1）：
         detect() 判 tauri 可用性时读的是 __TTsProbe，而本函数以前只写 __TTsSpeak。
         全仓 grep：__TTsProbe 有 1 处读、0 处写。
         后果：宿主注入成功，detect() 仍判不出 tauri → engine 停在 'web'
         → speakTauri 永远不会被调用。而 Android 浏览器没有 speechSynthesis
         → 最终落地 engine='none'，老人没有声音。

         为什么「导出一个探针函数」而不是改成读 __TTsSpeak：
           保持 detectTauriPlugin 的语义（问「引擎可用吗」），不改调用方签名；
           宿主若自带更精细的 __TTsProbe（比如真的去查语言包），不覆盖它。 */
      if (typeof global.__TTsProbe !== 'function') {
        global.__TTsProbe = function () { return true; };
      }

      /* 注入可能在 detect() 之后发生（页面加载顺序不定）。
         此时 engine 已被定成 web/none，只写探针也不够——要重新探测一次。
         只在「当前不是 tauri」时重探，避免已有正确状态被推翻。 */
      if (state.engine !== 'tauri') {
        lg('info', '注入 Tauri 适配器，重新探测引擎', { before: state.engine });
        detect();
      }
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   应急助手 · 语音输入（ASR）
   依据：docs/01 §4.2「按住说话 → 云 ASR → 场景归一」

   ⚠️ 为什么不用 Web Speech API（SpeechRecognition）：
     ① Android WebView 不支持（Chromium 官方，docs/03 事实 1）
     ② 微信内不支持（事实 2）
     ③ 桌面 Chrome 虽支持，但它在服务端识别、无法控制采样率，
        且各浏览器行为不一致
   → 所以走「自己录音 + 上传云 ASR」：录音用 getUserMedia（跨平台一致），
     识别用 DeepSeek /v1/tools/asr（2026-11-19 实测 891/936ms，识别正确）。

   三个必须守住的约束：
     A. **必须处于安全上下文**（https 或 localhost）。file:// 拿不到麦克风，
        这不是 bug 是平台规则。必须明确告知，不能让用户以为按钮坏了。
     B. **必须给可见反馈**。录音中、识别中都要有状态，不许无反馈等待
        （docs/01 §8 红线 1）。
     C. **失败必须分类**。无权限 / 无设备 / 太短 / 识别为空 / 网络 / 超时，
        每类给不同的话，不合并成「识别失败」。

   采样率：浏览器 AudioContext 通常是 48k，ASR 端点吃 16k 最稳，
   所以录完要重采样。见 resampleTo16k。
   ========================================================= */
(function (global) {
  'use strict';

  /* 运行日志（可选依赖） */
  var LOG = global.LOG || null;
  function lg(level, msg, fields) {
    if (!LOG) return;
    var t = LOG.tag('asr');
    if (t[level]) t[level](msg, fields);
  }

  var TARGET_RATE = 16000;     // ASR 端点实测可用
  var MIN_MS = 400;            // 短于此视为误触，不发
  var MAX_MS = 15000;          // 上限：防止按住不放一直录
  /* 端点由 log.js 的 resolveApiBase 决定（线上同源 / 本地回落 127.0.0.1:8787）。
     单独加载时兜底原地址。API_AUTH = 平台分享码，不依赖 cookie。 */
  var ENDPOINT =
    String(global.API_BASE || 'http://127.0.0.1:8787') + '/asr' + String(global.API_AUTH || '');
  var TIMEOUT_MS = 15000;

  var state = {
    supported: false,
    reason: null,            // 不可用原因（用户能看懂的话）
    recording: false,
    busy: false,             // 上传/识别中
    lastText: '',
    lastError: null,
    sourceRate: 0
  };

  var stats = { tries: 0, ok: 0, failed: 0, tooShort: 0, empty: 0 };

  var ctx = null;            // AudioContext
  var stream = null;         // MediaStream
  var source = null;         // MediaStreamSource
  var proc = null;           // ScriptProcessorNode
  var chunks = [];           // Float32Array[]
  var startedAt = 0;
  var autoStopTimer = null;

  /* ---------- 能力探测 ----------
     顺序有讲究：先判安全上下文，再判 API 存在，最后判设备。
     因为「不支持」和「不安全」的处置完全不同（前者无解，后者起服务器即可）。 */
  function detect() {
    var nav = global.navigator || {};
    var md = nav.mediaDevices;

    /* localhost / 127.0.0.1 / https 之外都是不安全上下文。
       file:// 双击打开就落在这里——这是最常见的踩坑点。 */
    var secure = (typeof global.isSecureContext === 'boolean')
      ? global.isSecureContext
      : isLocalHost(global.location && global.location.hostname, global.location && global.location.protocol);

    if (!secure) {
      state.supported = false;
      state.reason = '语音输入需要先启动本地服务（地址是 localhost 或 https）。直接双击打开网页拿不到麦克风。';
      lg('warn', 'ASR 不可用：非安全上下文', { origin: global.location && global.location.origin });
      return state;
    }
    if (!md || typeof md.getUserMedia !== 'function') {
      state.supported = false;
      state.reason = '这台设备的浏览器不支持录音。';
      lg('warn', 'ASR 不可用：无 getUserMedia');
      return state;
    }
    if (typeof global.AudioContext !== 'function' && typeof global.webkitAudioContext !== 'function') {
      state.supported = false;
      state.reason = '这台设备的浏览器不支持录音处理。';
      lg('warn', 'ASR 不可用：无 AudioContext');
      return state;
    }
    state.supported = true;
    state.reason = null;
    return state;
  }

  function isLocalHost(host, proto) {
    if (proto === 'https:') return true;
    return host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '::1';
  }

  /* ---------- 录音 ---------- */
  function pickAudioCtx() {
    var C = global.AudioContext || global.webkitAudioContext;
    return new C();
  }

  function start() {
    if (state.recording) return Promise.resolve({ ok: false, reason: 'already-recording' });
    /* 并发保护第二道：上一次的流没关干净时 state.recording 可能已复位，
       但 stream/ctx 还在。必须先彻底清理再开新的，否则两个音频流会一起
       往同一个 chunks 数组推数据 —— 实测录出过 26 秒 / 52 秒的音频
       （15 秒上限形同失效，且把扬声器的朗读声也录了进去）。 */
    if (stream || ctx || proc) {
      lg('warn', '检测到未清理的录音资源，先强制清理');
      cleanup();
    }
    var d = detect();
    if (!d.supported) return Promise.resolve({ ok: false, reason: 'unsupported', message: d.reason });

    chunks = [];
    return (global.navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        // 关掉浏览器侧的自动增益/降噪：老人环境噪声大，过度处理反而伤语音

        noiseSuppression: false,
        autoGainControl: false

      stream = s;
      ctx = pickAudioCtx();
      state.sourceRate = ctx.sampleRate;
      source = ctx.createMediaStreamSource(s);
      /* ScriptProcessorNode 虽已废弃，但兼容性最好（含 Android WebView）。
         用 4096 缓冲：约 85ms@48k，延迟与稳定性折中。 */
      proc = ctx.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = function (ev) {
        if (!state.recording) return;
        var inp = ev.inputBuffer.getChannelData(0);
        // 必须复制：inputBuffer 会被复用，直接存引用会拿到全 0
        chunks.push(new Float32Array(inp));

      source.connect(proc);
      /* 接到 destination 才会持续触发 onaudioprocess。
         为避免把麦克风原声播出来（啸叫），接到一个 0 增益节点。 */
      var mute = ctx.createGain();
      mute.gain.value = 0;
      proc.connect(mute);
      mute.connect(ctx.destination);

      state.recording = true;
      startedAt = Date.now();
      lg('info', '开始录音', { rate: state.sourceRate });
      if (LOG && LOG.always) LOG.always('asr', '开始录音', { rate: state.sourceRate });

      /* 上限保险丝：防止按住不放（老人可能按住了就忘了松）。
         ⚠️ 这里必须把「被自动停了」告诉界面，否则识别结果没人接收——
            先前版本自己调 stop()，Promise 结果直接丢掉，表现为
            「录到 15 秒就没了，什么也没发生」。 */
      autoStopTimer = setTimeout(function () {
        lg('warn', '录音达到上限，自动停止', { maxMs: MAX_MS });
        if (typeof state.onAutoStop === 'function') {
          try { state.onAutoStop(); } catch (e) { /* 界面回调出错不能影响录音清理 */ }
        } else {
          stop();   // 没有界面接管时才自己停（自测场景）
        }

    }).catch(function (e) {
      var name = (e && e.name) || '';
      var msg = '打不开麦克风。';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        msg = '没有麦克风权限。请在浏览器地址栏允许使用麦克风，然后再试。';
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        msg = '这台设备没有找到麦克风。';
      } else if (name === 'NotReadableError') {
        msg = '麦克风被别的程序占用了（比如正在打电话）。关掉那个程序再试。';
      } else if (name === 'SecurityError') {
        /* 实测出现过：页面被嵌在 iframe 里且未授予 microphone 权限。
           这句话必须说清「不是你操作错了」，否则老人只会反复按按钮。 */
        msg = '页面被嵌在其他窗口里，浏览器不允许用麦克风。请在新标签页里打开这个网页。';
      } else if (name === 'NotSupportedError' || name === 'TypeError') {
        msg = '这台设备的浏览器不支持这种录音方式。可以用输入法自带的语音输入打字。';
      }
      state.lastError = name || String(msg);
      lg('warn', '打开麦克风失败', { error: state.lastError, message: msg });
      cleanup();
      return { ok: false, reason: 'mic', message: msg };
    });
  }

  /* 停止录音并识别。返回 {ok, text, ...} 或 {ok:false, reason, message} */
  function stop() {
    if (!state.recording) return Promise.resolve({ ok: false, reason: 'not-recording' });
    var ms = Date.now() - startedAt;
    state.recording = false;
    if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
    cleanupKeepCtx();

    if (ms < MIN_MS || !chunks.length) {
      stats.tooShort++;
      lg('info', '录音太短，未上传', { ms: ms, chunks: chunks.length });
      teardownCtx();
      return Promise.resolve({ ok: false, reason: 'too-short', message: '说话时间太短了，请按住多说两个字。' });
    }

    var flat = mergeChunks(chunks);
    var resampled = resampleTo16k(flat, state.sourceRate || TARGET_RATE);
    var wav = encodeWav(resampled, TARGET_RATE);
    lg('info', '录音结束，准备上传', {
      ms: ms, srcRate: state.sourceRate, samples: resampled.length, bytes: wav.byteLength
    });
    chunks = [];
    teardownCtx();

    stats.tries++;
    state.busy = true;
    return upload(wav).then(function (r) {
      state.busy = false;
      if (!r.ok) { stats.failed++; return r; }
      if (!r.text) {
        // 端点返回 200 但文本为空：多半是没说话/只有噪声
        stats.empty++;
        lg('info', '识别结果为空', { duration_ms: r.duration_ms });
        return { ok: false, reason: 'empty', message: '没有听清。请靠近一点，按住按钮再说一遍。' };
      }
      stats.ok++;
      state.lastText = r.text;
      if (LOG && LOG.always) {
        LOG.always('asr', '识别完成', {
          text: r.text.slice(0, 40), textLen: r.text.length,
          audioMs: r.duration_ms, latencyMs: r.latency_ms
        });
      }
      return { ok: true, text: r.text, duration_ms: r.duration_ms, latency_ms: r.latency_ms };
    });
  }

  function upload(wav) {
    var url = ENDPOINT + (LOG && LOG.getTrace() ? '?trace=' + encodeURIComponent(LOG.getTrace()) : '');
    var ctrl = (typeof global.AbortController === 'function') ? new global.AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;

    return (global.fetch || (global.globalThis && global.globalThis.fetch))(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },

      if (timer) clearTimeout(timer);
      if (!res.ok) {
        return res.text().then(function (t) {
          return { ok: false, reason: 'http', message: '识别服务出错了（' + res.status + '）。', detail: String(t).slice(0, 120) };
        });
      }
      return res.json();
    }).then(function (d) {
      if (d && d.ok === false) return d;   // 上面 http 分支已返回
      return { ok: true, text: String((d && d.text) || '').trim(), duration_ms: d && d.duration_ms, latency_ms: d && d.latency_ms };
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      var isAbort = e && (e.name === 'AbortError' || /abort/i.test(String(e.message)));
      var msg = isAbort ? '识别太慢了，没等到结果。请再试一次。' : '连不上识别服务。请确认本地服务在运行。';
      state.lastError = String((e && e.message) || e);
      lg('error', isAbort ? 'ASR 请求超时' : 'ASR 请求失败', { error: state.lastError });
      return { ok: false, reason: isAbort ? 'timeout' : 'network', message: msg };
    });
  }

  function cancel() {
    if (!state.recording) return;
    state.recording = false;
    if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
    chunks = [];
    cleanup();
    lg('info', '录音被取消');
  }

  /* ---------- 音频处理 ---------- */

  function mergeChunks(list) {
    var total = 0;
    for (var i = 0; i < list.length; i++) total += list[i].length;
    var out = new Float32Array(total);
    var off = 0;
    for (var j = 0; j < list.length; j++) { out.set(list[j], off); off += list[j].length; }
    return out;
  }

  /* 线性插值重采样到 16k。
     为什么不用 OfflineAudioContext：它对 48k→16k 的空值处理依赖浏览器实现，
     而且异步流程会让「按住松手到发请求」多一跳。线性插值对语音识别足够。
     为什么不做低通滤波：16k 目标、源多为 48k（3:1 整数倍）时简单平均即可；
     若源是 44.1k，线性插值的混叠对 ASR 影响很小（实测识别正确）。 */
  function resampleTo16k(input, srcRate) {
    if (!srcRate || srcRate === TARGET_RATE) return input;
    var ratio = srcRate / TARGET_RATE;
    var outLen = Math.floor(input.length / ratio);
    var out = new Float32Array(outLen);
    for (var i = 0; i < outLen; i++) {
      var pos = i * ratio;
      var i0 = Math.floor(pos);
      var i1 = Math.min(i0 + 1, input.length - 1);
      var frac = pos - i0;
      out[i] = input[i0] * (1 - frac) + input[i1] * frac;
    }
    return out;
  }

  /* 16bit 单声道 WAV。手写头部而不是引库：42 行，无依赖。 */
  function encodeWav(samples, rate) {
    var buf = new ArrayBuffer(44 + samples.length * 2);
    var view = new DataView(buf);
    function str(off, s) { for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
    str(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    str(8, 'WAVE');
    str(12, 'fmt ');
    view.setUint32(16, 16, true);          // fmt 块大小
    view.setUint16(20, 1, true);           // PCM
    view.setUint16(22, 1, true);           // 单声道
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 2, true);    // 字节率
    view.setUint16(32, 2, true);           // 块对齐
    view.setUint16(34, 16, true);          // 位深
    str(36, 'data');
    view.setUint32(40, samples.length * 2, true);
    var off = 44;
    for (var i = 0; i < samples.length; i++) {
      var v = Math.max(-1, Math.min(1, samples[i]));
      // 负半区用 32768、正半区用 32767，避免溢出
      view.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      off += 2;
    }
    return buf;
  }

  /* ---------- 资源清理 ---------- */
  function cleanupKeepCtx() {
    try { if (proc) { proc.onaudioprocess = null; proc.disconnect(); } } catch (e) { /* ignore */ }
    try { if (source) source.disconnect(); } catch (e) { /* ignore */ }
    try {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    } catch (e) { /* ignore */ }
    proc = null; source = null; stream = null;
  }

  function teardownCtx() {
    try { if (ctx && ctx.state !== 'closed') ctx.close(); } catch (e) { /* ignore */ }
    ctx = null;
  }

  function cleanup() {
    cleanupKeepCtx();
    teardownCtx();
  }

  global.ASR = {
    detect: detect,
    start: start,
    stop: stop,
    cancel: cancel,
    state: state,
    stats: stats,
    config: { TARGET_RATE: TARGET_RATE, MIN_MS: MIN_MS, MAX_MS: MAX_MS, ENDPOINT: ENDPOINT },
    // 供自测直接验证编码正确性（不必真开麦克风）
    _internals: {
      resampleTo16k: resampleTo16k,
      encodeWav: encodeWav,
      mergeChunks: mergeChunks,
      isLocalHost: isLocalHost
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<!-- 2026-11-19 拆分（docs/10 §7）：state 必须最先，其余模块依赖它；

     app.js 必须最后，它消费其余全部模块。

<script>
/* =========================================================
   应急助手 · 跨模块共享状态
   依据：docs/10-代码质量门槛.md §6「横切模块必须可摘除」

   为什么单独一个文件（而不是留在 app.js）：
     state.mode / state.locked 被 render / speak / talk 三个模块读，
     若定义在最后加载的 app.js 里，前面三个模块在**加载期**读不到。
     函数体内运行时读没问题，但「加载期就能读」这条更不容易写出隐蔽 bug。

     docs/03 §2.6.5 R4 —— 会话记忆不落盘。老人可能把手机给别人用，

  'use strict';

  var KB = global.KNOWLEDGE || { slots: [], entries: {}, data_date: '' };

  global.APP_STATE = {
    // 模式：'daily' | 'emergency'
    mode: 'daily',
    // S8：命中危险信号后锁定，不可回日常。刷新页面才解。
    locked: false,
    /* 会话上文（2026-11-20）：只存用户原话，不存模型结论。
       为什么只存原话：模型判定的 intent/scene 一旦进记忆，第一轮判错，
       后面每轮都在错的基础上继续，且没有机制能发现。
       为什么放这里而不落盘：与 locked 同理 —— 刷新即清，避免把上一个人的会话带给下一个人。
       条数与字数**不在这里裁剪**：上限唯一实现在代理 normalizeContext，
       两处各裁一次会让数字对不上。 */

    autoRead: { muted: false },
