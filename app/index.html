<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>应急助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 常驻免责（S6）：固定顶部，不弹窗、不遮挡任何按钮 -->
<header class="disclaimer" role="note">
  内容为公开科普整理，不能替代专业急救
</header>

<!-- 紧急模式色带：命中危险信号后出现，不可手动关闭（S8） -->
<div class="mode-band" id="modeBand" hidden>
  <span class="band-dot" aria-hidden="true"></span>
  <strong>已切到紧急指引</strong>
</div>

<main id="main">

  <!-- ============ 日常模式 ============ -->
  <section id="dailyView" class="view">
    <h1 class="ask-title">有什么想了解的？</h1>

    <form class="ask-row" id="dailyForm" autocomplete="off">
      <label class="sr-only" for="dailyInput">输入你的问题</label>
      <input id="dailyInput" class="ask-input" type="text"
             placeholder="比如：怎么预防燃气泄漏" enterkeyhint="search">
      <button class="ask-btn" type="submit">提问</button>
    </form>

    <!-- 按住说话（M2）：pointerdown 开始录、pointerup 发送。
         放在输入框下方而不是替换输入框 —— 打字仍然是最可靠的路径，
         语音是给不会打字的老人用的，两条路都要留着。 -->
    <div class="voicein-row">
      <button class="talk-btn" id="dailyTalk" type="button">
        <span class="talk-ico" aria-hidden="true">🎤</span>
        <span class="talk-label">按住说话</span>
      </button>
      <p class="talk-hint" id="dailyTalkHint" hidden></p>
    </div>

    <p class="section-label">或者直接点下面的场景</p>
    <nav class="icons" id="dailyIcons" aria-label="常见场景"></nav>

    <div id="dailyAnswer" class="answer-area" aria-live="polite"></div>
  </section>

  <!-- ============ 紧急模式 ============ -->
  <section id="emergencyView" class="view" hidden>
    <h1 class="sos-title">先做这些</h1>

    <form class="ask-row" id="emgForm" autocomplete="off">
      <label class="sr-only" for="emgInput">说出或输入发生了什么</label>
      <input id="emgInput" class="ask-input" type="text"
             placeholder="比如：煤气漏了" enterkeyhint="search">
      <button class="ask-btn sos-btn" type="submit">确认</button>
    </form>

    <div class="voicein-row">
      <button class="talk-btn sos-talk" id="emgTalk" type="button">
        <span class="talk-ico" aria-hidden="true">🎤</span>
        <span class="talk-label">按住说话</span>
      </button>
      <p class="talk-hint" id="emgTalkHint" hidden></p>
    </div>

    <nav class="icons" id="emgIcons" aria-label="常见场景"></nav>

    <div id="emgAnswer" class="answer-area" aria-live="assertive"></div>
  </section>

  <!-- 朗读语速（K3，2026-11-19 补）
       为什么放在页面底部而不是顶部：老人不需要每次调它，设一次就一直生效
       （已落盘 localStorage）。放在显眼位置反而会占掉紧急场景的注意力。
       为什么只有两档：三档以上老人记不住哪档是自己上次选的；
       「慢」= 0.75（比默认 0.9 更慢，给听不清的人），「正常」= 1.0。
       注意：默认仍是 0.9（偏慢），用户不碰这个控件也满足「默认偏慢」。 -->
  <section class="rate-row" id="rateRow" aria-label="朗读语速">
    <span class="rate-label">朗读速度</span>
    <div class="rate-opts" role="group">
      <button class="rate-btn" type="button" data-rate="0.75" aria-pressed="false">慢一点</button>
      <button class="rate-btn" type="button" data-rate="1" aria-pressed="false">正常</button>
    </div>
  </section>

</main>

<script src="log.js"></script>
<script src="knowledge.js"></script>
<script src="retrieval.js"></script>
<script src="llm.js"></script>
<script src="voice.js"></script>
<script src="asr.js"></script>
<script src="app.js"></script>
</body>
</html>
