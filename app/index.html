<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>应急助手</title>
<link rel="stylesheet" href="style.css?v=20261121m25">
</head>
<body>

<!-- 常驻免责（S6）：固定顶部，不弹窗、不遮挡任何按钮 -->
<header class="disclaimer" role="note">
  内容为公开科普整理，不能替代专业急救
</header>

<!-- 紧急模式色带：命中危险信号后出现，不可手动关闭（S8） -->
<div class="mode-band" id="modeBand" hidden role="alert">
  <span class="band-dot" aria-hidden="true"></span>
  <strong>紧急指引 · 按下面步骤做</strong>
</div>

<main id="main">

  <!-- ============ 消息流（2026-11-19 由双视图合并，用户裁决「聊天式」） ============
       为什么不再有 dailyView / emergencyView 两段：
         双视图靠 hidden 隐藏旧内容，而聊天式要求「旧内容留在上面可回看」，
         两者无法共存。模式改由「顶部色带 + 每条消息的 is-emergency 样式」体现。
       #msgFlow 是滚动内容区，#msgScroll 是外层滚动容器（结构分层，
       让「滚到底」与「内容追加」互不干扰）。 -->
  <div id="msgScroll" class="msg-scroll">
    <div id="msgFlow" class="msg-flow" role="log" aria-live="polite">

      <article class="msg msg-assistant" id="welcomeMsg">
        <p class="chat-greeting">你好，我是应急助手。</p>
        <p class="chat-sub">按住下面的「按住说话」，说出发生了什么。也可以打字，或点一个场景。</p>
        <!-- 场景入口保留为文字按钮：不用 emoji，老人不靠猜图标。 -->
        <nav class="icons" id="msgIcons" aria-label="常见场景"></nav>
      </article>

    </div>
  </div>

  <!-- ============ 输入区（常驻底部，不随消息消失） ============
       结构说明：
         - 两个 form 互为显隐，而不是共用一个：测试与既有逻辑按
           dailyInput / emgInput 分别取输入框（老人切换模式后
           上一个问题不该留在框里）。隐藏的那个不参与渲染。
         - 为什么输入区固定在底部：用户裁决「输入区域会永久显示」，
           若随消息流滚动上去，老人回看时要滚回来才能再问一句。 -->
  <div class="composer" id="composer">

    <!-- 每步可见进展（M2.5，01 §4.25 第 2 条）：
         不遮消息流、不弹窗；只在 /act 循环期间显示，最终卡出现就隐藏。
         文案必须是真的（正在查资料 / 正在准备回答），不写「请稍等，正在思考」。 -->
    <div class="progress" id="progress" role="status" aria-live="polite" hidden>
      正在处理…
    </div>

    <!-- 按住说话（M2）放在输入框上方：老人第一眼看到的主操作是「说」，
         打字是第二条路。两个按钮互为显隐，与下面的 form 同步。 -->
    <div class="voicein-row">
      <button class="talk-btn" id="dailyTalk" type="button">
        <span class="talk-label">按住说话</span>
      </button>
      <button class="talk-btn sos-talk" id="emgTalk" type="button" hidden>
        <span class="talk-label">按住说话</span>
      </button>
      <p class="talk-hint" id="dailyTalkHint" hidden></p>
      <p class="talk-hint" id="emgTalkHint" hidden></p>
    </div>

    <form class="ask-row" id="dailyForm" autocomplete="off">
      <label class="sr-only" for="dailyInput">输入你的问题</label>
      <input id="dailyInput" class="ask-input" type="text"
             placeholder="也可以打字：比如怎么预防燃气泄漏" enterkeyhint="search">
      <button class="ask-btn" type="submit">提问</button>
    </form>

    <form class="ask-row" id="emgForm" autocomplete="off" hidden>
      <label class="sr-only" for="emgInput">说出或输入发生了什么</label>
      <input id="emgInput" class="ask-input" type="text"
             placeholder="也可以打字：比如煤气漏了" enterkeyhint="search">
      <button class="ask-btn sos-btn" type="submit">确认</button>
    </form>

    <!-- 朗读语速（K3，2026-11-19 补）
         为什么放在输入区而不是消息流里：老人不需要每次调它，设一次就一直生效
         （已落盘 localStorage）。放在消息流里会随滚动消失。
         为什么只有两档：三档以上老人记不住哪档是自己上次选的；
         「慢」= 0.75（比默认 0.9 更慢，给听不清的人），「正常」= 1.0。
         注意：默认仍是 0.9（偏慢），用户不碰这个控件也满足「默认偏慢」。 -->
    <section class="rate-row" id="rateRow" aria-label="朗读语速">
      <span class="rate-label">语速</span>
      <div class="rate-opts" role="group">
        <button class="rate-btn" type="button" data-rate="0.75" aria-pressed="false">慢一点</button>
        <button class="rate-btn" type="button" data-rate="1" aria-pressed="false">正常</button>
      </div>
    </section>

  </div>

</main>

<script src="log.js?v=20261121m25"></script>
<script src="knowledge.js?v=20261121m25"></script>
<script src="retrieval.js?v=20261121m25"></script>
<script src="llm.js?v=20261121m25"></script>
<script src="voice.js?v=20261121m25"></script>
<script src="asr.js?v=20261121m25"></script>
<!-- 2026-11-19 拆分（docs/10 §7）：state 必须最先，其余模块依赖它；
     chat 在 render 之前：render 不依赖 chat，但 talk/app 都依赖 chat；
     app.js 必须最后，它消费其余全部模块。
     ⚠️ 跨模块引用一律「运行时取」（见 render.js 的 speakLayer 注释）：
        2026-11-19 曾因加载期缓存导致 13 条断言变红、朗读全部静默。 -->
<script src="state.js?v=20261121m25"></script>
<script src="chat.js?v=20261121m25"></script>
<!-- 工具表必须在 agent.js 之前：调度器运行时取 window.TOOLS -->
<script src="tools.js?v=20261121m25"></script>
<script src="render.js?v=20261121m25"></script>
<script src="speak.js?v=20261121m25"></script>
<script src="talk.js?v=20261121m25"></script>
<script src="agent.js?v=20261121m25"></script>
<script src="app.js?v=20261121m25"></script>
</body>
</html>
